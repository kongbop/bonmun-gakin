// 지문 묶음(g)별 문제를 유형 순서대로 나눈다. 한 지문을 여러 유형이 같이 쓰면 유형마다 지문을 다시 보여 준다.
function varBlocks(groups, items){
  const out = [];
  const order = [...TYPE_ORDER, ...new Set(items.map(q => TYPE_GROUP(q.type)).filter(t => !TYPE_ORDER.includes(t)))];
  order.forEach(type => groups.forEach(g => {
    const qs = items.filter(q => q.ctx === g && TYPE_GROUP(q.type) === type);
    if(qs.length) out.push({type, g, qs});
  }));
  return out;
}

function fcRange(){ let a = fcIdx(FC.opt.from), b = fcIdx(FC.opt.to); if(a < 0) a = 0; if(b < 0) b = DATA.length - 1; return a <= b ? [a, b] : [b, a]; }
const fcIn = it => { const [a, b] = fcRange(); const i = fcIdx(it.k); return i >= a && i <= b; };
const fcRangeLabel = () => { const [a, b] = fcRange(); const n = i => DATA[i].key.replace('-','~') + '번'; return a === 0 && b === DATA.length - 1 ? '전체 지문' : a === b ? n(a) + ' 지문' : `${n(a)} ~ ${n(b)} 지문`; };
const fcSave = () => { try{ localStorage.setItem('mock10-fc', JSON.stringify({opt: FC.opt})); }catch(e){} };
const FC_CAN_SAY = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
function fcSay(word){
  if(!FC_CAN_SAY) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(word); u.lang = 'en-US'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang)); if(v) u.voice = v;
    speechSynthesis.speak(u); }catch(e){}
}
function fcPool(){
  const order = {}; DATA.forEach((p,i) => order[p.key] = i);
  return Object.entries(VOC.items)
    .filter(([id,it]) => fcIn(it))
    .filter(([id,it]) => FC.opt.only === 'all' || it.fc !== 1)
    .sort((a,b) => (order[a[1].k] - order[b[1].k]) || (a[1].t - b[1].t))
    .map(([id]) => id);
}
function fcSections(pool){ const n = FC.opt.size || pool.length || 1; const out = []; for(let i=0;i<pool.length;i+=n) out.push(pool.slice(i, i+n)); return out; }
function fcStart(sec){
  const secs = fcSections(fcPool()); if(!secs.length) return;
  sec = Math.max(0, Math.min(sec, secs.length - 1));
  const ids = secs[sec];
  FC.sess = {label: fcRangeLabel(), sec, secN: secs.length, ids, round:1, queue: FC.opt.shuffle ? shuffle(ids) : ids.slice(), i:0, known:[], unknown:[], open:false, hist:[], done:false};
}
function fcAnswer(know){
  const S = FC.sess; if(!S || S.done) return;
  const id = S.queue[S.i]; const it = VOC.items[id];
  S.hist.push({id, prev: it ? it.fc : undefined, know});
  if(it){ it.fc = know ? 1 : 0; it.fcn = (it.fcn || 0) + 1; it.fct = Date.now(); persistVoc(); }
  (know ? S.known : S.unknown).push(id);
  S.i++; S.open = false;
  if(S.i >= S.queue.length) S.done = true;
}
function fcUndo(){
  const S = FC.sess; if(!S || !S.hist.length) return;
  const h = S.hist.pop(); const it = VOC.items[h.id];
  if(it){ if(h.prev === undefined) delete it.fc; else it.fc = h.prev; it.fcn = Math.max(0, (it.fcn || 1) - 1); persistVoc(); }
  const arr = h.know ? S.known : S.unknown; const k = arr.lastIndexOf(h.id); if(k >= 0) arr.splice(k, 1);
  S.done = false; S.i = Math.max(0, S.i - 1); S.open = false;
}
function fcNextRound(){ const S = FC.sess; S.round++; S.queue = FC.opt.shuffle ? shuffle(S.unknown) : S.unknown.slice(); S.unknown = []; S.i = 0; S.done = false; S.open = false; S.hist = []; }
const fcMarkEx = (ex, words) => { let h = esc(ex); for(const w of words){ if(!w) continue; const re = new RegExp('(^|[^A-Za-z])(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=[^A-Za-z]|$)', 'i'); if(re.test(h)){ h = h.replace(re, '$1<mark>$2</mark>'); break; } } return h; };

function renderFlash(m){
  const top = el('div',{class:'fctop'});
  const back = el('button',{class:'btn sm',type:'button'}, '← 단어장 목록');
  back.addEventListener('click', ()=>{ FC.on = false; FC.sess = null; if(FC_CAN_SAY) try{ speechSynthesis.cancel(); }catch(e){} render(); window.scrollTo(0,0); });
  top.appendChild(back);
  m.appendChild(el('h2',{class:'mh'}, '플래시카드 암기'));
  m.appendChild(top);
  // 본문 암기에서 단어를 누를 때 뜨는 안내가 카드·버튼을 가리지 않게 닫는다
  const tt = document.getElementById('toast'); if(tt){ clearTimeout(showToast.tm); clearTimeout(showToast.tm2); tt.remove(); }
  const S = FC.sess;
  if(!S){ renderFlashSetup(m); return; }
  top.appendChild(el('span',{class:'grow'}));
  const reset = el('button',{class:'btn sm',type:'button'}, '설정 바꾸기');
  reset.addEventListener('click', ()=>{ FC.sess = null; render(); });
  top.appendChild(reset);
  // 구간 정보
  m.appendChild(el('div',{class:'fctop',style:'margin-top:0'}, `<span class="grow"><b>제 ${S.sec+1}구간</b> <span class="srcl">(${esc(S.label)} · 전체 ${S.secN}구간 · 이 구간 ${S.ids.length}장)</span></span><b>${S.round}라운드</b>`));
  if(S.done){ renderFlashDone(m, S); return; }
  const id = S.queue[S.i]; const it = VOC.items[id];
  if(!it){ S.i++; if(S.i >= S.queue.length) S.done = true; render(); return; }
  const bar = el('div',{class:'fcbar'}); bar.appendChild(el('i',{style:`width:${Math.round(S.i / S.queue.length * 100)}%`})); m.appendChild(bar);
  m.appendChild(el('div',{class:'fctop'}, `<span class="grow">${S.i+1} / ${S.queue.length}장</span><span style="color:var(--good)">알아요 ${S.known.length}</span><span style="color:var(--bad)">몰라요 ${S.unknown.length}</span>`));

  const enFirst = FC.opt.front === 'en';
  const card = el('div',{class:'fc-card',tabindex:'0','aria-label':'플래시카드. 누르면 답이 보입니다.'});
  const front = el('div',{class:'fc-front'});
  const pk = it.k.replace('-','~');
  if(enFirst){
    front.appendChild(el('div',{class:'fc-w'}, esc(it.w)));
    if(it.f && it.f.toLowerCase() !== it.w.toLowerCase()) front.appendChild(el('div',{class:'srcl'}, `본문에서는 <span style="font-family:var(--font-en)">${esc(it.f)}</span>`));
  } else {
    front.appendChild(el('div',{class:'fc-k'}, esc(it.m || '(뜻 없음)')));
  }
  if(FC_CAN_SAY && (enFirst || S.open)){
    const say = el('button',{class:'fc-say',type:'button','aria-label':'발음 듣기'}, '🔊 발음');
    say.addEventListener('click', e => { e.stopPropagation(); fcSay(it.w); });
    front.appendChild(say);
  }
  front.appendChild(el('div',{class:'srcl'}, `${esc(pk)}번 지문${it.fcn ? ` · 지금까지 ${it.fcn}번 봤어요` : ''}${it.fc === 1 ? ' · 전에 알아요' : it.fc === 0 ? ' · 전에 몰라요' : ''}`));
  card.appendChild(front);
  if(S.open){
    const b = el('div',{class:'fc-back'});
    if(enFirst) b.appendChild(el('div',{class:'fc-k'}, esc(it.m || '(뜻 없음 — 단어장 목록에서 뜻 수정을 눌러 적어 주세요)')));
    else {
      b.appendChild(el('div',{class:'fc-w'}, esc(it.w)));
      if(it.f && it.f.toLowerCase() !== it.w.toLowerCase()) b.appendChild(el('div',{class:'srcl'}, `본문에서는 <span style="font-family:var(--font-en)">${esc(it.f)}</span>`));
    }
    if(it.ex) b.appendChild(el('div',{class:'fc-ex'}, fcMarkEx(it.ex, [it.f, it.w])));
    if(it.exk && it.exk !== it.m) b.appendChild(el('div',{class:'fc-exk'}, `끊어 읽기: “${esc(it.exk)}”`));
    card.appendChild(b);
  } else {
    const cov = el('button',{class:'fc-cover',type:'button'}, enFirst ? '뜻을 떠올린 뒤 눌러서 확인' : '영어 단어를 떠올린 뒤 눌러서 확인');
    card.appendChild(cov);
  }
  // 누르기 = 뒤집기, 옆으로 밀기 = 알아요(오른쪽)/몰라요(왼쪽)
  let sx = null, sy = null, moved = false;
  card.addEventListener('pointerdown', e => { if(e.target.closest('.fc-say')) return; sx = e.clientX; sy = e.clientY; moved = false; });
  card.addEventListener('pointermove', e => { if(sx === null) return; const dx = e.clientX - sx; if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(e.clientY - sy)){ moved = true; card.style.transform = `translateX(${dx}px) rotate(${dx/30}deg)`; } });
  const end = e => {
    if(sx === null) return; const dx = e.clientX - sx; sx = null; card.style.transform = '';
    if(moved && Math.abs(dx) > 80){ fcGo(dx > 0, card); return; }
    if(!moved && e.type === 'pointerup' && !e.target.closest('.fc-say')) fcFlip();
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  m.appendChild(card);
  const btns = el('div',{class:'fc-btns'});
  const no = el('button',{class:'btn fc-no',type:'button'}, '몰라요');
  const yes = el('button',{class:'btn fc-yes',type:'button'}, '알아요');
  no.addEventListener('click', ()=> fcGo(false, card)); yes.addEventListener('click', ()=> fcGo(true, card));
  btns.appendChild(no); btns.appendChild(yes); m.appendChild(btns);
  const tools = el('div',{class:'fctop',style:'justify-content:center;margin-top:10px'});
  if(S.hist.length){ const u = el('button',{class:'btn sm',type:'button'}, '↶ 되돌리기'); u.addEventListener('click', ()=>{ fcUndo(); render(); }); tools.appendChild(u); }
  m.appendChild(tools);
  m.appendChild(el('p',{class:'fc-tip'}, '카드를 누르면 답이 보여요. 휴대폰은 카드를 오른쪽으로 밀면 알아요, 왼쪽으로 밀면 몰라요. 키보드는 스페이스 = 뒤집기, → 알아요, ← 몰라요.'));
  if(FC.opt.say && FC_CAN_SAY && S.saidFor !== id + (S.open ? 'o' : 'c') && (enFirst ? !S.open : S.open)){ S.saidFor = id + (S.open ? 'o' : 'c'); setTimeout(()=> fcSay(it.w), 150); }
}
function fcFlip(){ const S = FC.sess; if(!S || S.done) return; S.open = !S.open; render(); }
function fcGo(know, card){
  const S = FC.sess; if(!S || S.done || S.busy) return;
  S.busy = true;
  if(card) card.classList.add(know ? 'out-r' : 'out-l');
  setTimeout(()=>{ S.busy = false; fcAnswer(know); render(); }, card ? 170 : 0);
}
function renderFlashDone(m, S){
  const d = el('div',{class:'fc-done'});
  const unk = S.unknown;
  if(unk.length){
    d.appendChild(el('div',{class:'big'}, `${S.round}라운드 끝!`));
    d.appendChild(el('div',{class:'fc-stat'}, `<span style="color:var(--good)">알아요 <b>${S.queue.length - unk.length}</b></span><span style="color:var(--bad)">몰라요 <b>${unk.length}</b></span>`));
    const l = el('div',{class:'fc-list'}); unk.forEach(id => { const it = VOC.items[id]; if(it) l.appendChild(el('span',{}, esc(it.w))); }); d.appendChild(l);
    d.appendChild(el('p',{class:'hint',style:'margin:0'}, '한 번에 외우기보다 라운드를 나눠 여러 번 보는 게 더 오래 남아요. 다음엔 답을 먼저 떠올린 뒤 확인해 보세요.'));
    const again = el('button',{class:'btn primary',type:'button'}, `모르는 카드 다시 학습 (${unk.length})`);
    again.addEventListener('click', ()=>{ fcNextRound(); render(); window.scrollTo(0,0); });
    d.appendChild(again);
  } else {
    d.appendChild(el('div',{class:'big'}, `🎉 제 ${S.sec+1}구간 ${S.ids.length}장을 다 외웠어요!`));
    d.appendChild(el('div',{class:'hint',style:'margin:0'}, `${S.round}라운드 만에 끝냈어요.`));
    const row = el('div',{class:'seg',style:'justify-content:center'});
    if(S.sec < S.secN - 1){ const nx = el('button',{class:'btn primary',type:'button'}, `다음 구간 (제 ${S.sec+2}구간) →`); nx.addEventListener('click', ()=>{ fcStart(S.sec + 1); render(); window.scrollTo(0,0); }); row.appendChild(nx); }
    const re = el('button',{class:'btn',type:'button'}, '이 구간 다시'); re.addEventListener('click', ()=>{ fcStart(S.sec); render(); }); row.appendChild(re);
    const fin = el('button',{class:'btn',type:'button'}, '끝내기'); fin.addEventListener('click', ()=>{ FC.on = false; FC.sess = null; render(); window.scrollTo(0,0); }); row.appendChild(fin);
    d.appendChild(row);
  }
  if(S.hist.length){ const u = el('button',{class:'btn sm',type:'button',style:'justify-self:center'}, '↶ 마지막 카드 되돌리기'); u.addEventListener('click', ()=>{ fcUndo(); render(); }); d.appendChild(u); }
  m.appendChild(d);
}
function renderFlashSetup(m){
  const box = el('div',{class:'fcset'});
  const seg = (label, key, opts) => {
    const w = el('div'); w.appendChild(el('div',{class:'lab'}, label));
    const r = el('div',{class:'seg'});
    opts.forEach(([v, t]) => { const b = el('button',{class:'btn'+(FC.opt[key] === v ? ' on' : ''),type:'button','aria-pressed':String(FC.opt[key] === v)}, t); b.addEventListener('click', ()=>{ FC.opt[key] = v; fcSave(); render(); }); r.appendChild(b); });
    w.appendChild(r); return w;
  };
  // 범위: ○번 지문부터 ○번 지문까지
  const cnt = k => Object.values(VOC.items).filter(it => it.k === k).length;
  const sw = el('div'); sw.appendChild(el('div',{class:'lab'}, '단어 범위'));
  const row = el('div',{class:'fcrange'});
  const mk = (key, label) => {
    const s = el('select',{'aria-label':label});
    DATA.forEach(p => s.appendChild(el('option',{value:p.key}, `${p.key.replace('-','~')}번 (${cnt(p.key)}개)`)));
    s.value = FC.opt[key]; if(s.value !== FC.opt[key]) s.selectedIndex = key === 'from' ? 0 : DATA.length - 1;
    s.addEventListener('change', ()=>{ FC.opt[key] = s.value; fcSave(); render(); });
    return s;
  };
  row.appendChild(mk('from', '시작 지문')); row.appendChild(el('span',{}, '부터'));
  row.appendChild(mk('to', '끝 지문')); row.appendChild(el('span',{}, '까지'));
  sw.appendChild(row);
  const quick = el('div',{class:'seg',style:'margin-top:6px'});
  const [ra, rb] = fcRange(); const isAll = ra === 0 && rb === DATA.length - 1;
  const allB = el('button',{class:'btn sm'+(isAll ? ' on' : ''),type:'button'}, `전체 지문 (${vocCount()}개)`);
  allB.addEventListener('click', ()=>{ FC.opt.from = DATA[0].key; FC.opt.to = DATA[DATA.length-1].key; fcSave(); render(); });
  quick.appendChild(allB);
  sw.appendChild(quick);
  box.appendChild(sw);
  box.appendChild(seg('카드', 'only', [['all','전체 카드'],['left','아직 못 외운 카드만']]));
  box.appendChild(seg('앞면', 'front', [['en','영어 → 뜻'],['ko','뜻 → 영어']]));
  box.appendChild(seg('구간 크기', 'size', [[10,'10장'],[20,'20장'],[30,'30장'],[0,'한 번에 전부']]));
  box.appendChild(seg('카드 순서', 'shuffle', [[true,'섞기'],[false,'추가한 순서']]));
  if(FC_CAN_SAY) box.appendChild(seg('발음 자동 재생', 'say', [[false,'끄기'],[true,'켜기']]));
  m.appendChild(box);
  const pool = fcPool(); const secs = fcSections(pool);
  const all = Object.values(VOC.items).filter(fcIn);
  const okN = all.filter(it => it.fc === 1).length, noN = all.filter(it => it.fc === 0).length;
  m.appendChild(el('p',{class:'hint'}, `${fcRangeLabel()} 단어 ${all.length}개 중 알아요 ${okN}개 · 몰라요 ${noN}개 · 아직 안 본 카드 ${all.length - okN - noN}개`));
  if(!pool.length){ m.appendChild(el('div',{class:'gist'}, FC.opt.only === 'left' ? '이 범위의 카드를 모두 외웠어요! ‘전체 카드’로 바꾸면 다시 볼 수 있어요.' : '이 범위에 카드가 없어요.')); return; }
  const list = el('div',{class:'seg'});
  secs.forEach((ids, i) => {
    const b = el('button',{class:'btn'+(i===0?' primary':''),type:'button'}, secs.length === 1 ? `암기 시작 (${ids.length}장)` : `제 ${i+1}구간 시작 (${ids.length}장)`);
    b.addEventListener('click', ()=>{ fcStart(i); render(); window.scrollTo(0,0); });
    list.appendChild(b);
  });
  m.appendChild(list);
  m.appendChild(el('p',{class:'fc-tip',style:'text-align:left'}, '알아요/몰라요로 나누면, 다음 라운드에는 몰라요 카드만 다시 나와요. 모두 알아요가 되면 그 구간이 끝나요. 알아요·몰라요 기록은 단어장에 함께 저장돼요.'));
}
document.addEventListener('keydown', e => {
  if(!(st.mode === 'voc' && FC.on && FC.sess && !FC.sess.done)) return;
  if(e.target.closest && e.target.closest('input,textarea,select')) return;
  if(e.key === ' ' || e.key === 'Enter'){ if(e.target.closest && e.target.closest('button:not(.fc-cover)')) return; e.preventDefault(); fcFlip(); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); fcGo(true, document.querySelector('.fc-card')); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); fcGo(false, document.querySelector('.fc-card')); }
});

function renderMyVocab(m){
  if(FC.on){ renderFlash(m); return; }
  m.appendChild(el('h2',{class:'mh'}, '내 단어장'));
  const all = Object.entries(VOC.items);
  m.appendChild(el('p',{class:'hint'}, (VOC.where==='account' ? '내 계정에 저장되어 다른 기기에서도 이어집니다. ' : '지금은 이 브라우저에만 저장됩니다. ') + '본문 암기 탭에서 단어를 누르면 추가됩니다. 뜻을 가리고 떠올려 본 뒤 눌러서 확인하세요.'));
  renderTransfer(m);
  if(!all.length){
    m.appendChild(el('div',{class:'gist'}, '아직 추가한 단어가 없습니다. 지문별 학습 → 본문 암기에서 모르는 단어를 눌러 보세요.'));
    return;
  }
  const bar = el('div',{class:'toolbar'});
  bar.appendChild(el('button',{class:'btn primary',onclick:()=>{ FC.on = true; FC.sess = null; render(); window.scrollTo(0,0); }}, '플래시카드로 외우기'));
  bar.appendChild(el('button',{class:'btn'+(st.vocHide?' on':''),onclick:()=>{st.vocHide=!st.vocHide; render();}}, st.vocHide?'뜻 보이기':'뜻 가리고 외우기'));
  bar.appendChild(el('span',{class:'score'}, `${all.length}개`));
  m.appendChild(bar);
  DATA.forEach((p,pi)=>{
    const items = all.filter(([id,it]) => it.k === p.key).sort((a,b)=> a[1].t - b[1].t);
    if(!items.length) return;
    const h = el('h3',{}, `${esc(p.key.replace('-','~'))}번 지문 (${items.length}) `);
    const go = el('button',{class:'btn sm',type:'button'}, '본문 보기'); go.addEventListener('click', ()=>{ st.mode='study'; st.p=pi; st.tab='text'; save(); render(); window.scrollTo(0,0); });
    h.appendChild(go); m.appendChild(h);
    const g = el('div',{class:'mygrid'});
    items.forEach(([id,it]) => g.appendChild(vocCard(id, it, {hide: st.vocHide})));
    m.appendChild(g);
  });
}
render();
</script>
