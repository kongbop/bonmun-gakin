<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10월 모의고사 시험범위 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an exam notebook — ink-blue rules, highlighter marks for answers, one passage at a time */
:root{
  --paper:#f6f7fa; --sheet:#ffffff; --ink:#1b2333; --muted:#5d6778; --rule:#dfe3ea;
  --accent:#2747a8; --accent-soft:#e8edfb; --marker:#ffe98a; --good:#1f7a4d; --good-soft:#e2f4ea; --bad:#b4342c; --bad-soft:#fbe6e4;
  --font-display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --font-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151d; --sheet:#181d27; --ink:#e7eaf0; --muted:#9aa3b3; --rule:#2a313e;
    --accent:#8fa8ff; --accent-soft:#1f2740; --marker:#5c4d12; --good:#5fd39a; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1c1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151d; --sheet:#181d27; --ink:#e7eaf0; --muted:#9aa3b3; --rule:#2a313e;
  --accent:#8fa8ff; --accent-soft:#1f2740; --marker:#5c4d12; --good:#5fd39a; --good-soft:#15301f; --bad:#ff8a80; --bad-soft:#3a1c1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}
header.top h1{font-family:var(--font-display);font-size:1.45rem;line-height:1.3;margin:0 0 4px;text-wrap:balance}
header.top p{margin:0;color:var(--muted);font-size:.92rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.card{min-width:0;overflow-wrap:anywhere;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:20px}
.phead{display:grid;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.phead .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.num{font-family:var(--font-display);font-weight:700;font-size:1.6rem;color:var(--accent);font-variant-numeric:tabular-nums}
.qtype{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 10px;font-size:.85rem;font-weight:700}
.ten{font-family:var(--font-en);font-size:1.05rem;font-weight:600;margin:0;text-wrap:balance}
.tko{color:var(--muted);margin:0;font-size:.95rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 18px;border-bottom:1px solid var(--rule)}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:560px){.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-bottom:0}.tab{border:1px solid var(--rule);border-radius:8px;margin:0;padding:8px 4px;text-align:center}.tab[aria-selected="true"]{background:var(--accent);color:var(--sheet);border-color:var(--accent)}}
h3{font-family:var(--font-display);font-size:1rem;margin:22px 0 8px;color:var(--ink)}
h3:first-child{margin-top:0}
.gist{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 14px;border-radius:0 8px 8px 0;font-weight:500}
.point{border:1px dashed var(--accent);border-radius:8px;padding:12px 14px;font-size:.95rem}
ul.flow{margin:0;padding-left:18px;display:grid;gap:4px}
table.gr{width:100%;border-collapse:collapse;font-size:.93rem}
table.gr td{border-top:1px solid var(--rule);padding:8px 6px;vertical-align:top}
table.gr td:first-child{font-family:var(--font-en);width:46%}
.tblwrap{overflow-x:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9rem;font-weight:500}
.btn.on{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--sheet);border-color:var(--accent)}
.score{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.sent{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:10px 4px;border-top:1px solid var(--rule);cursor:pointer}
.sent:first-of-type{border-top:0}
.sent .m{color:var(--accent);font-weight:700}
.sent .front{font-family:var(--font-en);font-size:1.04rem}
.sent.ko-first .front{font-family:var(--font-body);font-size:.98rem}
.sent .back{color:var(--muted);font-size:.93rem;margin-top:4px}
.sent.ko-first .back{font-family:var(--font-en);font-size:1.02rem;color:var(--ink)}
.sent .back.hidden{color:transparent;background:var(--rule);border-radius:4px;user-select:none}
.passage{font-family:var(--font-en);font-size:1.06rem;line-height:2.1}
.choice{display:inline-flex;gap:0;border:1px solid var(--accent);border-radius:6px;overflow:hidden;vertical-align:baseline;margin:0 2px;font-family:var(--font-en)}
.choice sup{font-family:var(--font-body);font-size:.65rem;color:var(--sheet);background:var(--accent);padding:0 4px;display:flex;align-items:center}
.choice button{border:0;background:var(--sheet);padding:0 7px;cursor:pointer;font-size:.98rem;line-height:1.6}
.choice button+button{border-left:1px solid var(--rule)}
.choice button.right{background:var(--good-soft);color:var(--good);font-weight:600}
.choice button.wrong{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.choice.done button:not(.right):not(.wrong){opacity:.45}
.fix{border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:8px}
.fixlist{display:grid;gap:12px}
.fix .s{font-family:var(--font-en);font-size:1.03rem}
.fix .n{font-size:.82rem;font-weight:700;color:var(--bad)}
.ans{background:var(--good-soft);border-radius:8px;padding:10px 12px}
.ans b{color:var(--good)}
.ans .why{color:var(--muted);font-size:.92rem;margin-top:2px}
.wr{border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:10px}
.wrlist{display:grid;gap:14px}
.wr .ko{font-weight:500}
.wr .cond{font-size:.86rem;color:var(--muted)}
.wr textarea{width:100%;min-height:84px;border:1px solid var(--rule);border-radius:8px;padding:10px;font-family:var(--font-en);font-size:1rem;background:var(--paper);color:var(--ink);resize:vertical}
.wr .model{font-family:var(--font-en);font-size:1.03rem}
.diff span.miss{background:var(--marker);border-radius:3px;padding:0 2px}
.diff span.extra{color:var(--bad);text-decoration:line-through}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.vcard{border:1px solid var(--rule);border-radius:10px;padding:12px;min-height:84px;cursor:pointer;display:grid;align-content:start;gap:4px;background:var(--sheet);text-align:left}
.vcard .w{font-family:var(--font-en);font-weight:600;font-size:1.02rem}
.vcard .k{color:var(--muted);font-size:.92rem}
.vcard .hidden{color:transparent!important;background:var(--rule);border-radius:4px}
.hint{font-size:.85rem;color:var(--muted)}
.epass{font-family:var(--font-en);font-size:1.05rem;line-height:1.95;display:grid;gap:10px}
.epass u{text-decoration-thickness:1.5px;text-underline-offset:3px}
.blank{display:inline-block;min-width:9em;border-bottom:2px solid var(--ink)}
.given{border:1.5px solid var(--ink);border-radius:6px;padding:10px 12px;font-family:var(--font-en);font-size:1.03rem;margin-bottom:10px}
.stem{font-weight:700;margin:0 0 12px}
.opts{display:grid;gap:6px;margin-top:14px}
.opt{display:flex;gap:8px;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--font-en);font-size:1rem}
.opt.ko{font-family:var(--font-body);font-size:.95rem}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qblock+.qblock{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.vgroup{border:1px solid var(--rule);border-radius:12px;padding:14px;display:grid;gap:12px}
.vlist{display:grid;gap:16px}
.vlabel{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.vpass{font-family:var(--font-en);font-size:1.02rem;line-height:1.9}
.vpass .brk{background:var(--accent-soft);border-radius:4px;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.vpass .mk{font-family:var(--font-body);color:var(--accent);font-weight:700;white-space:nowrap}
.opts.nums{display:flex;flex-wrap:wrap;gap:8px}
.opts.nums .opt{flex:1 1 0;min-width:52px;justify-content:center;font-size:1.15rem;padding:10px 0}
.foot{font-size:.8rem;color:var(--muted)}
.vq{border-top:1px dashed var(--rule);padding-top:12px;display:grid;gap:8px}
.vq .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:.75rem;font-weight:700;border-radius:5px;padding:1px 7px;background:var(--accent-soft);color:var(--accent)}
.tag.src{background:var(--paper);color:var(--muted);border:1px solid var(--rule)}
.summ{border:1.5px solid var(--ink);border-radius:6px;padding:10px 12px;font-family:var(--font-en)}
.summ .ab{font-family:var(--font-body);font-weight:700}
.para{font-family:var(--font-en);line-height:1.85}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.exp{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:.92rem;line-height:1.7}
.exp .hd{font-weight:700;color:var(--good)}
.exp .hd.no{color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.mode{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:9px 6px;cursor:pointer;font-family:var(--font-display);font-weight:700;color:var(--muted)}
.mode.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.badge{display:inline-block;min-width:1.5em;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;line-height:1.5;margin-left:2px}
.mh{font-family:var(--font-display);font-size:1.2rem;margin:0 0 8px}
.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.prog div{height:100%;background:var(--accent)}
.score.big{font-size:1.3rem;margin-left:0}
.tag.no{background:var(--bad-soft);color:var(--bad)}
.kop{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;font-family:var(--font-body);font-size:.95em}
.bogi{border:1px dashed var(--ink);border-radius:6px;padding:8px 10px;font-family:var(--font-en);line-height:1.8}
.bogi .bl{font-family:var(--font-body);font-weight:700;font-size:.8rem;border:1px solid var(--ink);border-radius:4px;padding:0 5px;margin-right:4px}
ul.cond{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.tag.wr{background:var(--marker);color:var(--ink)}
.btn.ok{border-color:var(--good);color:var(--good)} .btn.ng{border-color:var(--bad);color:var(--bad)}
.ilrow{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px solid var(--rule)}
.ilrow:first-of-type{border-top:0}
@media (min-width:760px){.ilrow{grid-template-columns:minmax(0,1fr) 15.5rem;gap:18px}}
.il{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:7px;row-gap:6px}
.il .m{color:var(--accent);font-weight:700;margin-right:2px}
.nwg{display:inline-flex;white-space:nowrap}
.nwg .pw.punct{margin-left:0}
.unit{display:inline-flex;flex-direction:column;align-items:flex-start;max-width:100%;min-width:0}
.uen{font-family:var(--font-en);font-size:1.06rem;line-height:1.35;display:inline-flex;gap:4px;flex-wrap:wrap}
.uko{font-size:.74rem;color:var(--muted);line-height:1.3;min-height:1em;white-space:normal;word-break:keep-all}
.uko.hid{color:transparent;background:var(--rule);border-radius:3px;cursor:pointer;min-width:2.2em}
.pw.punct{margin-left:-4px}
.wd{cursor:pointer;border-radius:3px;padding:0 1px;text-decoration:underline dotted transparent}
.wd:hover{background:var(--accent-soft)}
.wd.in{background:var(--marker)}
.full{font-size:.88rem;color:var(--ink);background:var(--paper);border-radius:8px;padding:8px 10px;line-height:1.6;align-self:start}
.full.hid{color:transparent;background:var(--rule);cursor:pointer;user-select:none}
#toast.fade{opacity:0}
#toast{transition:opacity .8s ease;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--sheet);border:1px solid var(--ink);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:50;display:grid;gap:6px;font-size:.92rem}
.trow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.trow input,.mycard input{flex:1;min-width:8em;border:1px solid var(--rule);border-radius:6px;padding:5px 8px;background:var(--paper);color:var(--ink);font:inherit}
.tw{font-family:var(--font-en);font-size:1.02rem}
.srcl{font-size:.76rem;color:var(--muted)}
.ok{color:var(--good);font-weight:700;font-size:.85rem}
.x{border:0;background:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--muted)}
.btn.sm{padding:3px 9px;font-size:.8rem}
.mygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mycard{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:5px;background:var(--sheet)}
.mycard .mm{font-weight:500}
.mycard .mm.hid{color:transparent;background:var(--rule);border-radius:4px;cursor:pointer}
.mycard .ex{font-family:var(--font-en);font-size:.85rem;color:var(--muted)}
.badge.blue{background:var(--accent)}
.mh .btn,h3 .btn{margin-left:6px;vertical-align:middle}
footer{margin-top:24px;font-size:.82rem;color:var(--muted)}
.xfer{margin:10px 0 16px;border:1px solid var(--rule);border-radius:12px;padding:10px 14px;background:var(--card,#fff)}
.xfer summary{cursor:pointer;font-weight:600;font-size:.92rem}
.xstep{font-weight:700;font-size:.85rem;margin-top:10px;color:var(--accent)}
.xmsg{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:.88rem;line-height:1.45}
.fcset{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--sheet);display:grid;gap:10px;margin:10px 0 16px}
.fcset .lab{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn{padding:6px 11px;font-size:.88rem}
.fcrange{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fcrange span{font-size:.9rem}
.fcset select{font:inherit;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%}
.fctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 8px;font-size:.9rem}
.fctop .grow{flex:1}
.fcbar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-bottom:12px}
.fcbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.fc-card{position:relative;border:1px solid var(--rule);border-radius:16px;background:var(--sheet);box-shadow:0 2px 10px rgba(0,0,0,.06);min-height:300px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s, opacity .18s}
.fc-card.out-r{transform:translateX(60%) rotate(6deg);opacity:0}
.fc-card.out-l{transform:translateX(-60%) rotate(-6deg);opacity:0}
.fc-front{padding:26px 18px 14px;text-align:center;display:grid;gap:6px;justify-items:center}
.fc-w{font-family:var(--font-en);font-size:clamp(1.6rem,7vw,2.3rem);font-weight:700;line-height:1.2;word-break:break-word}
.fc-k{font-size:clamp(1.2rem,5.4vw,1.6rem);font-weight:700;line-height:1.35;word-break:keep-all}
.fc-say{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.fc-back{flex:1;border-top:1px dashed var(--rule);margin:0 14px;padding:14px 4px 16px;display:grid;gap:8px;align-content:start;text-align:center}
.fc-cover{flex:1;margin:0 12px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;min-height:110px;border:0;font:inherit;font-weight:700;width:calc(100% - 24px)}
.fc-ex{font-family:var(--font-en);font-size:.92rem;line-height:1.5;color:var(--ink);text-align:left;background:var(--paper);border-radius:8px;padding:8px 10px}
.fc-ex mark{background:var(--marker);color:inherit;border-radius:3px;padding:0 2px}
.fc-exk{font-size:.85rem;color:var(--muted);text-align:left}
.fc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-btns .btn{padding:14px 8px;font-size:1.02rem;font-weight:700}
.fc-no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.fc-yes{background:var(--good-soft);color:var(--good);border-color:var(--good-soft)}
.fc-tip{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}
.fc-done{border:1px solid var(--rule);border-radius:16px;background:var(--sheet);padding:22px 18px;text-align:center;display:grid;gap:12px}
.fc-done .big{font-size:1.25rem;font-weight:700}
.fc-stat{display:flex;justify-content:center;gap:18px;font-size:.95rem}
.fc-stat b{font-size:1.3rem}
.fc-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fc-list span{border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-family:var(--font-en);font-size:.88rem}
.fcmark{font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.fcmark.ok{background:var(--good-soft);color:var(--good)}
.fcmark.no{background:var(--bad-soft);color:var(--bad)}
.xmsg:empty{display:none}
.xrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.xcode{width:100%;box-sizing:border-box;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--rule);border-radius:8px;padding:8px;word-break:break-all}
.vtype{margin:22px 0 8px;font-size:1rem;color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.navrow .btn{flex:1 1 0;text-align:center;line-height:1.25}
.navrow .nsub{display:block;font-size:.72rem;font-weight:500;opacity:.85}
.navrow .btn{white-space:nowrap}
@media (max-width:420px){.navrow{gap:6px}.navrow .btn{font-size:.82rem;padding:8px 4px}}
@media (max-width:420px){.card{padding:16px}.num{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

s to a particular audience, and certainly Aristotle is no exception.", "ko": "그것은 ‘우리’가 모든 위대한 사상가는 그들 자신만의 시대에 속해 있고 특정한 청중들에게 말한다는 것을 기억하는 데 도움이 되며, 확실히 아리스토텔레스도 예외는 아니다."}, {"m": "❻", "en": "Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "ko": "그가 이해했던 대로의 인간 번영은 아마도 결코 오늘날 우리가 그것이 그러하기를 원하는 만큼 포용적이지는 않을 것이다."}, {"m": "❼", "en": "How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good.", "ko": "그가 옳음과 선을 어떻게 이해했는가는 고대 그리스 사회의 특권 엘리트 계층이 옳음과 선을 어떻게 이해하는 경향이 있었는가에 대한 척도로 가장 잘 여겨진다."}, {"m": "❽", "en": "As a result, for all it does well, it is also deeply flawed.", "ko": "그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다."}], "gram": {"text": "❶ {{0}} though he may be, some of Aristotle’s ideas meet us today as strange. ❷ He had no difficulty {{1}} slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. ❸ Because of their practice of contemplation for the highest human good, philosophers were {{2}} worthy to have all the best things in life. ❹ Somehow that assertion seems oddly self-serving. ❺ {{3}} serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. ❻ Human flourishing as he understood it probably would not be nearly as {{4}} as we would want it to be today. ❼ How he understood right and good is best {{5}} to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. ❽ As a result, for all it does well, it is also deeply flawed.", "items": [{"n": 1, "opts": ["Consistent", "Consistently"], "a": 0}, {"n": 2, "opts": ["justifying", "to justify"], "a": 0}, {"n": 3, "opts": ["considered", "considering"], "a": 0}, {"n": 4, "opts": ["It", "That"], "a": 0}, {"n": 5, "opts": ["inclusive", "inclusively"], "a": 0}, {"n": 6, "opts": ["taken", "taking"], "a": 0}]}, "variants": [{"label": "Step 01 · 복합형", "passage": "Consistent though he may be, some of Aristotle’s ideas meet us today as (ㄱ) [ familiar / strange ]. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly (ㄴ) [ self-serving / altruistic ]. It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as (ㄷ) [ inclusive / exclusive ] as we would want it to be today. How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"src": "Step 01 26번", "type": "어휘", "kind": "combo", "stem": "윗글의 괄호 (ㄱ), (ㄴ), (ㄷ) 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "ans": [0], "exp": "① [해설] (ㄱ) 아리스토텔레스의 생각 중 일부는 오늘날의 관점에서 보면 낯설어 보이며 그 예로 노예 제도 정당화를 보여주고 있으므로, ‘strange’가 적절하다. ‘familiar’는 '익숙한'이라는 의미이다. (ㄴ) 철학자들이 삶의 모든 좋은 것을 누릴 자격이 있다는 주장은 자신들의 이익만을 챙기는 것처럼 보인다는 것을 의미하므로, '자기 잇속만 차리는'이라는 의미의 'self-serving'이 적절하다. 'altruistic'은 '이타적인'이라는 의미이다. (ㄷ) 그의 인간 번영에 대한 이해는 특권 엘리트 계층에 국한되었을 것이므로, 오늘날 우리가 원하는 만큼 '포용적이지' 않았을 것이라는 내용이므로 'inclusive'가 적절하다. 'exclusive'는 '배타적인'이라는 의미이다.", "choices": ["(ㄱ) strange  ·  (ㄴ) self-serving  ·  (ㄷ) inclusive", "(ㄱ) strange  ·  (ㄴ) altruistic  ·  (ㄷ) exclusive", "(ㄱ) strange  ·  (ㄴ) self-serving  ·  (ㄷ) exclusive", "(ㄱ) familiar  ·  (ㄴ) altruistic  ·  (ㄷ) inclusive", "(ㄱ) familiar  ·  (ㄴ) self-serving  ·  (ㄷ) exclusive"]}, {"src": "Step 01 28번", "type": "요약문", "kind": "summary", "stem": "윗글의 내용을 다음과 같이 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "ans": [2], "exp": "③ 아리스토텔레스의 사상에는 장점이 있지만, 그것은 역사적 맥락에 의해 깊이 (A) 형성되었으며, 이 때문에 그의 견해 중 일부는 현대적 기준에서 윤리적으로 (B) 의문스러운 것이 된다. [해설] 이 글은 아리스토텔레스의 사상이 장점에도 불구하고 시대적·계층적 한계를 지니며, 그의 도덕관이 역사적 맥락에 의해 형성되었고, 일부 견해는 현대적 기준에서 윤리적으로 의문스럽다는 내용이다. 따라서 요약문의 빈칸 (A)에는 ‘shaped’가, (B)에는 ‘questionable’이 들어가는 것이 가장 적절하다. ① shaped : 형성된 / universal : 보편적인 ② challenged : 도전받은 / perfect : 완벽한 ④ challenged : 도전받은 / questionable : 의심스러운 ⑤ influenced : 영향받은 / universal : 보편적인", "choices": ["shaped / universal", "challenged / perfect", "shaped / questionable", "challenged / questionable", "influenced / universal"], "summary": "Although Aristotle’s thought has its merits, it was deeply (A) by its historical context, making some of his views ethically (B) by modern standards."}]}, {"label": "Step 02 · 유형별 A", "passage": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving. It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today. How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"src": "Step 02 7번", "type": "함축 의미", "kind": "list", "stem": "다음 글에서 밑줄 친 every great thinker is of her own time and speaks to a particular audience 가 의미하는 바로 가장 적절한 것은?", "choices": ["a thinker’s outlook is shaped by their era and audience", "the ideas of great thinkers possess timeless and universal truth", "a thinker’s popularity is determined by their communication skills", "modern audiences cannot truly understand the works of past philosophers", "a thinker communicates with a specific group of people during their lifetime"], "underline": "every great thinker is of her own time and speaks to a particular audience", "ans": [0], "exp": "① 사상가의 관점은 그가 속한 시대와 청중의 영향을 받아 형성된다 [해설] 밑줄 친 ‘모든 위대한 사상가는 그들 자신만의 시대에 속해 있고 특정한 청중들에게 말한다’는 사상가의 관점이 그가 살아간 시대의 사회적 가치와 그가 대상으로 삼은 청중의 영향을 받아 형성된다는 것을 의미한다. Aristotle의 사상이 당시 특권층의 시각을 반영한다는 설명은 이러한 시대적·사회적 한계를 보여준다. 따라서 밑줄 친 부분이 의미하는 바로 가장 적절한 것은 ‘사상가의 관점은 그가 속한 시대와 청중의 영향을 받아 형성된다’이다. ② 위대한 사상가들의 사상은 시대를 초월한 보편적 진리를 지닌다 ③ 사상가의 인기는 그의 의사소통 능력에 의해 결정된다 ④ 현대의 청중은 과거 철학자들의 저작을 제대로 이해할 수 없다 ⑤ 사상가는 살아 있는 동안 특정 집단의 사람들과 의사소통한다"}]}, {"label": "Step 02 · 유형별 A", "passage": "① [[Consistent]] though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered ② [[worthy]] to have all the best things in life. Somehow that assertion seems oddly self-serving. It serves us to remember that every great thinker is of her own time and speaks to a ③ [[universal]] audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as ④ [[inclusive]] as we would want it to be today. How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply ⑤ [[flawed]].", "foot": "* contemplation: 사유", "qs": [{"src": "Step 02 27번", "type": "어휘", "kind": "inline", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "choices": ["①", "②", "③", "④", "⑤"], "ans": [2], "exp": "③ universal (보편적인) → particular (특정한) [해설] 이 글은 Aristotle의 사상이 당시의 사회적 가치와 특권층의 관점을 반영하여 한계를 지닌다는 점을 설명하고 있다. 그의 도덕관이 고대 그리스 특권층의 시각을 드러낸다고 했으므로, 사상가가 특정한 청중을 대상으로 말한다고 하는 것이 문맥상 자연스럽다. 따라서 ‘보편적인, 모든 사람을 아우르는’이라는 의미의 ‘universal’은 ‘특정한’이라는 의미의 ‘particular’로 바뀌어야 한다."}]}, {"label": "Step 02 · 유형별 B", "passage": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. ( ① ) Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. ( ② ) It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. ( ③ ) Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today. ( ④ ) How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. ( ⑤ ) As a result, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"src": "Step 02 49번", "type": "문장 삽입", "kind": "insert", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "choices": ["①", "②", "③", "④", "⑤"], "given": "Somehow that assertion seems oddly self-serving.", "ans": [1], "exp": "② [해설] 주어진 문장의 ‘그 주장(that assertion)’은 철학자들이 최고의 인간적 선을 위해 사유하므로 삶의 가장 좋은 것들을 모두 누릴 자격이 있다는 앞 문장의 주장을 가리킨다. 주어진 문장은 이를 철학자 자신에게 유리한 주장이라고 평가하고, 뒤 문장은 사상가가 자신의 시대와 특정 청중의 영향을 받는다는 점을 기억하여 이러한 주장을 시대적 맥락에서 이해하도록 한다. 따라서 철학자들이 삶의 가장 좋은 것들을 누릴 자격이 있다는 주장이 제시된 직후인 ②번의 위치에 들어가는 것이 가장 적절하다."}]}, {"label": "Step 02 · 유형별 B", "passage": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving. It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today. How he understood right and good is best taken to be an indicator of {{BLANK}}. As a result, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"src": "Step 02 69번", "type": "빈칸", "kind": "blank", "stem": "다음 글을 읽고 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "choices": ["how universal ethical truths transcended social distinctions", "how slavery undermined the privileged status of philosophers", "how later generations corrected defects in ancient moral doctrines", "how socially advantaged groups in his culture conceptualized morality", "how Greek philosophers defended equal rights regardless of social rank"], "ans": [3], "exp": "④ 그가 속한 문화의 특권층이 도덕을 이해하던 방식 [해설] 이 글은 Aristotle의 사상이 그가 속한 시대와 특정 청중의 영향을 받으며, 당시 특권층의 관점을 반영하여 한계를 지닌다는 점을 설명하고 있다. 노예제의 정당화와 철학자들의 특권을 사례로 제시하고 그의 긍정적인 미래에 대한 상상이 오늘날의 기준보다 포용적이지 못하다고 평가하고 있으므로, 빈칸에는 그의 도덕관이 당시 특권층의 도덕적 이해를 드러낸다는 의미가 들어가야 한다. 따라서 ‘그가 속한 문화의 특권층이 도덕을 이해하던 방식’이 가장 적절하다. ① 보편적인 윤리적 진리가 사회적 차이를 초월하던 방식 ② 노예제가 철학자들의 특권적 지위를 약화시키던 방식 ③ 후대 사람들이 고대 도덕 사상의 결함을 바로잡던 방식 ⑤ 그리스 철학자들이 사회적 지위와 관계없이 평등한 권리를 옹호하던 방식 * 원문 변형 ④ how the privileged elite of ancient Greek society tended to understand right and good → how socially advantaged groups in his culture conceptualized morality"}]}, {"label": "Step 03 · 서술형 기본", "passage": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, (A) ": "윗글을 아래와 같이 요약할 때, 빈칸 ⓐ~ⓓ에 들어갈 단어를 알맞게 채우시오.", "extras": {"bogi": "", "cond": ["‘reflect’ 및 본문의 단어를 활용할 것", "ⓐ~ⓓ 각 한 단어"], "summary": "Aristotle's ⓐ moral ideas ⓑ the limited, ⓒ perspective of his ⓓ ancient Greek elite society.", "hint": ""}, "answer": "ⓐ flawed ⓑ reflect ⓒ self-serving ⓓ privileged", "exp": "Aristotle의 ⓐ 결함 있는 도덕적 사상은 그가 속했던 고대 그리스 ⓓ 특권 엘리트 사회의 한계 있고 ⓒ 이기적인 관점을 ⓓ 반영한다.", "id": "v-S3-28"}]}, {"label": "Step 03 · 서술형 심화 A", "passage": "ⓐ Consistently though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. ⓑ Because their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving. ⓒ It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. ⓓ Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today. ⓔ What he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"src": "Step 03 101번", "type": "어법 수정", "kind": "write", "stem": "윗글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 곳을 찾아 바르게 고치시오.", "extras": {"bogi": "", "cond": [], "summary": "", "hint": ""}, "answer": "ⓐ, ⓑ, ⓔ", "exp": "ⓐ Consistent though he may be, some of Aristotle’s ideas meet us today as strange. - as/though 양보절 도치 : 접속사 ‘as/though’가 양보의 용례로 쓰였을 때, 의미를 강조 하고자 ‘형용사/부사/분사’ 등이 문두로 이동한다. 뒤에 동사 ‘be’가 있으므로 보어 역할을 하는 형용사가 적절하다. though he may be consistent → Consistent though he may be ⓑ Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. - 전치사 because of + 명사(구) vs 접속사 because + 절 : 뒤에 명사구가 오므로 전치사가 적절하다. ⓔ How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. - 간접의문문 (의문부사 + 완전한 문장) : 주어 자리에 명사절로 간접의문문이 필요하며, ‘의문사 + 주어 + 동사’의 어순이 적절하다. 의문부사 ‘how, when, why, where’은 완전한 문장을 수반하고, 의문대명사 ‘what, which, who'는 불완전한 문장을 수반한다. 완전한 문장이므로 ‘how’ 가 적절하다.", "id": "v-S3-101"}]}, {"label": "Step 03 · 서술형 심화 B", "passage": "Consistently though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty to justify slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving. It serves us to remember what every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as inclusively as we would want it to be today. How he understood right and good is best taken to be an indicator of what the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"src": "Step 03 123번", "type": "어법 수정", "kind": "write", "stem": "다음 글에서 어법상 어색한 부분을 모두 골라 바르게 고치시오. (틀린 부분 6개)", "extras": {"bogi": "", "cond": [], "summary": "", "hint": ""}, "answer": "Consistently → Consistent\n…no difficulty to justify → justifying\n…. Because (빠짐) → of 추가\n…to remember what → that\n…nearly as inclusively → inclusive\n…indicator of what → how", "exp": "", "id": "v-S3-123"}]}, {"label": "Step 04 · 실전 모의고사 1회", "passage": "비록 Aristotle가 일관적일지라도, 그의 생각들 중 일부는 오늘날 우리에게 낯설게 다가온다. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving. It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today. How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"src": "Step 04 1회 3번", "type": "배열 영작", "kind": "write", "stem": "[주관식 1] 다음 글의 밑줄 친 우리말과 같도록 아래 <보기>의 단어를 알맞게 배열하시오.", "extras": {"bogi": "some / strange / he / though / us / consistent / of / be, / today / ideas / may / meet / as / Aristotle’s", "cond": ["형용사 + 접속사 도치 구문 활용, 단어 추가 없음"], "summary": "", "hint": ""}, "answer": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange.", "exp": "", "id": "v-S4r1-3"}]}, {"label": "Step 04 · 실전 모의고사 2회", "passage": "", "foot": "* contemplation: 사유", "qs": [{"src": "Step 04 2회 6번", "type": "글의 순서", "kind": "order", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "given": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange.", "paras": ["(A) Somehow that assertion seems oddly self-serving. It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception.", "(B) He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life.", "(C) Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today. How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply flawed."], "exp": "② [해설] 주어진 문장은 Aristotle의 일부 사상이 오늘날 낯설게 느껴진다고 제시한다. (B)는 이에 대한 구체적인 예시로 노예제 정당화와 철학자의 특권에 대해 설명하며 이어진다. (A)의 ‘that assertion (그 주장)’은 (B)의 마지막 부분의 ‘철학자들이 삶의 모든 좋은 것을 누릴 가치가 있다’는 주장을 가리키고, 모든 사상가는 시대의 산물이라는 일반화로 이어진다. 마지막으로 (C)는 이러한 시대적한계로 인해 그가 이해한 인간 번영이 포용적이지 못하고 그의 사상이 결함을 갖게 되었다는 결론으로 글을 마무리한다. 따라서 가장 적절한 순서는 (B)-(A)-(C)이다.", "ans": [1], "id": "v-S4r2-6"}]}, {"label": "워크북 · 문단순서배열", "passage": "", "foot": "* contemplation: 사유", "qs": [{"id": "v-W-4", "src": "워크북 순서 4번", "type": "글의 순서", "kind": "order", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "ans": [1], "exp": "② [해설] (워크북(3) 문단순서배열 문항을 5지선다로 바꿈) 주어진 글은 Aristotle이 노예제를 정당화했고 그의 시대 철학자들이 높은 특권을 누렸다고 했다. (B)는 그 이유(최고선을 사유하므로 삶의 가장 좋은 것들을 가질 자격이 있다고 여겨짐)를 말하고 that assertion(그 주장)이 자기 잇속만 차리는 것 같다고 평가한다. (A)는 모든 사상가는 자기 시대에 속한다는 점을 상기시키며 그의 생각이 오늘날만큼 포용적이지 않았을 것이라고 한다. (C)는 그의 이해가 특권 엘리트층의 이해를 보여 주는 지표이며 As a result 깊은 결함이 있다고 결론짓는다. 따라서 (B)-(A)-(C)이다.", "given": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and influence.", "paras": ["(A) It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today.", "(B) Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving.", "(C) How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. As a result, for all it does well, it is also deeply flawed."]}]}, {"label": "직전보강 · 시험 유형", "passage": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, (A) {{BLANK}}, and in his era, philosophers enjoyed positions of high privilege and influence. Because of their practice of contemplation for the highest human good, philosophers were considered worthy to have all the best things in life. Somehow that assertion seems oddly self-serving. It serves us to remember that every great thinker is of her own time and speaks to a particular audience, and certainly Aristotle is no exception. Human flourishing as he understood it probably would not be nearly as inclusive as we would want it to be today. How he understood right and good is best taken to be an indicator of how the privileged elite of ancient Greek society tended to understand right and good. (B) {{BLANK}}, for all it does well, it is also deeply flawed.", "foot": "* contemplation: 사유", "qs": [{"id": "v-J-8", "src": "직전보강 8번", "type": "빈칸 (연결어 쓰기)", "kind": "write", "stem": "윗글의 빈칸 (A), (B)에 들어갈 연결어를 각각 쓰시오.", "exp": "(A) 앞 문장의 ‘Aristotle의 일부 생각은 오늘날 낯설게 다가온다’에 대한 구체적인 예로 노예제를 정당화한 것을 들고 있으므로 for example. (B) 그의 옳음과 좋음에 대한 이해가 특권 엘리트층의 이해를 보여 주는 지표였다는 앞의 내용의 결과로, 그것이 잘한 점에도 불구하고 깊은 결함이 있다고 결론짓므로 As a result.", "answer": "(A) for example\n(B) As a result"}]}, {"label": "추가 변형 · 시험 유형 보충", "passage": "Consistent though he may be, some of Aristotle’s ideas meet us today as strange. He had no difficulty justifying slavery, for example, and in his era, philosophers enjoyed positions of high privilege and infl on", "aligned with public expectations"], "ans": 0, "why": "소셜 네트워크로 판결에 압박을 가하는 것은 해롭고, 재판은 광장에서 하면 안 됨 → 대중의 압박에 영향받지 않는(immune to popular pressure) 방식. ⑤ 대중의 기대에 맞춘다는 것은 정반대 함정."}, "sents": [{"m": "❶", "en": "If we understand mass culture as a weakening factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), diminishing their role and overlapping these institutions.", "ko": "만약 우리가 대중문화를 자신들의 전통들에 사람들을 결속시키는 문화적 유대감을 약화시키는 요인으로 이해한다면, 대중문화는 예를 들어 가족 또는 학교와 같은 사회 내의 매개하는 제도들을 약화시켜, 그것들의 역할을 축소시키고 이 제도들과 중첩된다."}, {"m": "❷", "en": "For example, courts are traditional social institutions and important for the normal and harmonious functioning of collective life.", "ko": "예를 들어, 법정은 전통적인 사회 기관이며 집단 생활의 정상적이고 조화로운 기능을 위해 중요하다."}, {"m": "❸", "en": "However, when people turn to social networks to put pressure on judicial decisions in certain mediated and politicized processes, this practice is popularized and becomes a habitual form of culture, which is harmful.", "ko": "하지만, 조정되고 정치화되는 어떤 과정에 있는 사법적 결정에 압박을 가하기 위해 사람들이 소셜 네트워크에 의존할 때, 이러한 관행은 대중화되고 습관적인 문화의 형태가 되며, 이는 해롭다."}, {"m": "❹", "en": "Justice must not be done in the public square, which today is converted into a virtual dimension, the social networks.", "ko": "재판은 대중 광장에서 집행되어서는 안 되며, 그것은 오늘날 가상의 차원, 즉 소셜 네트워크로 전환된다."}, {"m": "❺", "en": "In a democratic state of law, the appropriate place to judge and make justice is the court and in a way that is immune to popular pressure.", "ko": "민주적인 법치 국가에서, 재판하고 정의를 실현하기에 적절한 장소는 법정이며 대중의 압박에 영향을 받지 않는 방식이어야 한다."}], "gram": {"text": "❶ If we understand mass culture as a {{0}} factor of the cultural ties that unite people to their traditions, mass culture weakens the intermediary institutions in society (e.g. the family or the school), {{1}} their role and {{2}} these institutions. ❷ For example, courts are traditional social institutions and important for the normal ment but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life <span class=\"blank\">　　　　　　　　</span>."], "choices": ["is independent of the previous change", "allows room for adaptation and transformation", "leads to less variation in human development", "requires stability for meaningful growth to occur", "has its own limit in adjusting to new experiences"], "ans": 1, "why": "가소성 = 전 생애에 걸쳐 변화·적응 가능 → 변화 정도는 달라도 모든 단계가 적응과 변화의 여지를 허용(②). ④ ‘의미 있는 성장에는 안정이 필요하다’, ⑤ ‘새 경험에 적응하는 데 한계가 있다’는 전 생애에 걸친 변화를 강조하는 글의 흐름과 반대."}, "sents": [{"m": "❶", "en": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "ko": "인간 발달은 고정된 순서의 단계들이라기보다는 계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로 오늘날 점점 이해되고 있다."}, {"m": "❷", "en": "At the core of this perspective lies the concept of plasticity.", "ko": "이러한 관점의 핵심에는 가소성의 개념이 있다."}, {"m": "❸", "en": "Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.", "ko": "가소성은 삶의 경험들, 환경적 요구들, 그리고 생물학적 변화들에 반응하여 인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는 인간의 능력을 지칭한다."}, {"m": "❹", "en": "It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "ko": "그것은 개인들이 단순히 발달의 수동적인 수용자가 아니라 평생에 걸쳐 성장이 가능한 능동적인 주체들이라는 점을 강조한다."}, {"m": "❺", "en": "In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.", "ko": "이전의 관점들에서는 발달이 주로 아동기에 일어난다고 믿어졌으며, 성인기는 안정의 시기로, 그리고 노년기는 쇠퇴의 단계로 간주되었다."}, {"m": "❻", "en": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.", "ko": "가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다."}, {"m": "❼", "en": "Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "ko": "비록 변화의 정도가 서로 다른 단계들에서 다를지라도, 삶의 각각의 단계는 적응과 변화를 위한 여지를 허용한다."}], "gram": {"text": "❶ Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a {{0}} sequence of stages. ❷ At the core of this perspective {{1}} the concept of plasticity. ❸ Plasticity refers to the human capacity to change, adapt, and {{2}} cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. ❹ It highlights that individuals are not merely passive recipients of development {{3}} active agents capable of growth throughout their lives. ❺ In earlier views, development {{4}} to occur mainly during childhood, with adulthood {{5}} as a period of stability and old age as a phase of decline. ❻ The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. ❼ Although the extent of change may vary at different stages, every phase of life allows {{6}} for adaptation and transformation.", "items": [{"n": 1, "opts": ["fixed", "fixing"], "a": 0}, {"n": 2, "opts": ["lies", "lays"], "a": 0}, {"n": 3, "opts": ["reorganize", "reorganizing"], "a": 0}, {"n": 4, "opts": ["and", "but"], "a": 1}, {"n": 5, "opts": ["believed", "was believed"], "a": 1}, {"n": 6, "opts": ["seeing", "seen"], "a": 1}, {"n": 7, "opts": ["room", "rooms"], "a": 0}]}, "variants": [{"label": "Step 01 · 복합형", "passage": "Human development is now increasingly understood as an ongoing, (ㄱ) [ rigid / flexible ], and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents (ㄴ) [ capable / incapable ] of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for (ㄷ) [ stagnation / adaptation ] and transformation.", "foot": "", "qs": [{"src": "Step 01 56번", "type": "어휘", "kind": "combo", "stem": "윗글의 괄호 (ㄱ), (ㄴ), (ㄷ) 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "ans": [4], "exp": "⑤ [해설] (ㄱ) 인간 발달을 고정된 단계의 연속보다 경험과 환경에 따라 변화할 수 있는 과정으로 이해하는 흐름이므로, ‘유연한’이라는 의미의 ‘flexible’이 적절하다. ‘rigid’는 ‘경직된’이라는 의미이다. (ㄴ) 개인은 발달을 수동적으로 받아들이기만 하는 존재가 아니라 평생 성장할 수 있는 능동적 주체라는 흐름이므로, ‘할 수 있는’이라는 의미의 ‘capable’이 적절하다. ‘incapable’은 ‘할 수 없는’이라는 의미이다. (ㄷ) 변화의 정도는 시기에 따라 다르더라도 모든 삶의 단계에서 새로운 조건에 맞추어 변화할 여지가 있다는 것이므로, ‘적응’이라는 의미의 ‘adaptation’이 적절하다. ‘stagnation’은 ‘정체’라는 의미이다.", "choices": ["(ㄱ) flexible  ·  (ㄴ) incapable  ·  (ㄷ) adaptation", "(ㄱ) rigid  ·  (ㄴ) capable  ·  (ㄷ) adaptation", "(ㄱ) flexible  ·  (ㄴ) capable  ·  (ㄷ) stagnation", "(ㄱ) rigid  ·  (ㄴ) incapable  ·  (ㄷ) stagnation", "(ㄱ) flexible  ·  (ㄴ) capable  ·  (ㄷ) adaptation"]}, {"src": "Step 01 58번", "type": "요약문", "kind": "summary", "stem": "윗글의 내용을 다음과 같이 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "ans": [0], "exp": "① 가소성은 정신적·행동적 양식의 (A) 가변성과 모든 연령에서 추가적인 성장이 이루어질 (B) 가능성을 강조함으로써, 발달을 특정 연령에 한정하는 모형에 이의를 제기한다. [해설] 이 글은 인간 발달이 특정 시기에 국한되지 않고 전 생애에 걸쳐 이루어질 수 있으며, 경험과 환경에 따라 사고·감정·행동 양식을 재구성할 수 있고 모든 삶의 단계에 적응과 변화의 여지가 있다고 설명하는 내용이다. 따라서 요약문의 빈칸 (A)에는 ‘malleability’, 빈칸 (B)에는 ‘possibility’이 들어가는 것이 가장 적절하다. ② malleability : 가변성 / inevitability : 필연성 ③ permanence : 영속성 / possibility : 가능성 ④ permanence : 영속성 / impossibility : 불가능성 ⑤ unpredictability : 예측 불가능성 / impossibility : 불가능성", "choices": ["malleability / possibility", "malleability / inevitability", "permanence / possibility", "permanence / impossibility", "unpredictability / impossibility"], "summary": "Plasticity challenges an age-restricted model of development by emphasizing the (A) of mental and behavioural patterns and the (B) of further growth at every age."}]}, {"label": "Step 02 · 유형별 A", "passage": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "foot": "", "qs": [{"src": "Step 02 33번", "type": "제목", "kind": "list", "stem": "다음 글의 제목으로 가장 적절한 것은?", "choices": ["The Unchanging Blueprint of Human Growth", "Overcoming the Inevitable Decline of Old Age", "Why Is Early Childhood the Most Critical Period?", "Plasticity: The Key to Lifelong Human Development", "How the Environment Shapes Our Behavioral Patterns"], "ans": [3], "exp": "④ 가소성: 평생에 걸친 인간 발달의 열쇠 [해설] 이 글은 인간 발달이 고정된 것이 아니라 ‘가소성’ 덕분에 평생에 걸쳐 계속되는 유연한 과정이라고 설명한다. 가소성이 기존의 경직된 발달 관점에 이의를 제기하는 핵심 개념임을 강조하고 있다. 따라서 이 글의 제목으로 가장 적절한 것은 ‘가소성: 평생에 걸친 인간 발달의 열쇠’이다. ① 인간 성장의 불변하는 청사진 ② 노년의 필연적인 쇠퇴 극복하기 ③ 왜 유아기 초기가 가장 결정적인 시기인가? ⑤ 환경은 어떻게 우리의 행동 패턴을 형성하는가"}]}, {"label": "Step 02 · 유형별 B", "passage": "", "foot": "", "qs": [{"src": "Step 02 75번", "type": "글의 순서", "kind": "order", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "given": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages.", "paras": ["(A) The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "(B) At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes.", "(C) It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline."], "ans": [2], "exp": "③ [해설] 주어진 글은 인간 발달이 지속적이고 유연하게 변화하는 과정이라는 관점을 제시한다. (B)의 ‘this perspective’는 이러한 관점을 가리키며, 그 핵심 개념인 가소성을 소개하고 정의한다. (C)의 ‘It’ 은 (B)의 가소성을 받아 개인이 평생 능동적으로 성장할 수 있음을 설명한 뒤, 유년기 중심의 기존 발달관을 제시한다. (A)의 ‘this rigid outlook’이 (C)의 기존 발달관을 받아, 가소성이 이를 반박 한다는 점과 전 생애에 걸친 변화와 적응의 가능성을 강조하며 글을 마무리한다. 따라서 가장 적절한 순서는 (B)-(C)-(A)이다."}]}, {"label": "Step 03 · 서술형 기본", "passage": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. (A) 이러한 관점의 핵심에는 가소성의 개념이 있다. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for (B) {{BLANK}} and transformation.", "foot": "", "qs": [{"src": "Step 03 55번", "type": "배열 영작", "kind": "write", "stem": "윗글의 밑줄 친 (A)의 우리말과 같도록 아래 <조건>을 참고하여 알맞게 배열하시오.", "extras": {"bogi": "of / at / the core / of / lie / the concept / this / plasticity / perspective", "cond": ["부사구 도치 구문 활용 - <보기> 단어 어형 변화 주의, <보기> 포함 총 11단어"], "summary": "", "hint": ""}, "answer": "At the core of this perspective lies the concept of plasticity.", "exp": "", "id": "v-S3-55"}, {"src": "Step 03 56번", "type": "빈칸 쓰기", "kind": "write", "stem": "윗글의 빈칸 (B)에 들어갈 단어를 아래 <보기> 의 영영풀이를 참고하여 알맞게 쓰시오.", "extras": {"bogi": "[NOUN] the process of changing to fit some purpose or situation → a", "cond": [], "summary": "", "hint": ""}, "answer": "adaptation (적응)", "exp": "어떤 목적이나 상황에 맞게 변화하는 과정", "id": "v-S3-56"}, {"src": "Step 03 57번", "type": "주제·요지 영작", "kind": "write", "stem": "아래 <보기>의 단어를 알맞게 배열하여 윗글의 주제를 완성하시오.", "extras": {"bogi": "lifelong / capacity / human / development / adapt / of / plasticity / the / through", "cond": ["<보기> 중 한 단어 어형 변화"], "summary": "", "hint": ""}, "answer": "the lifelong adaptive capacity of human de  수동이면 과거분사를 사용한다. ‘adulthood’가 여겨지는 것이므로 수동의 의미이며, 분사 뒤 목적어가 없으므로 과거분사가 적절하다. ⓓ The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. - 명사절 접속사 that + 완전한 문장 : ‘emphasizing’의 목적어 자리로 명사절이 필요하며, 동사 ‘continues’는 자동사의 용례로 뒤에 완전한 문장이 오므로 ‘that’이 적절하다.", "id": "v-S3-107"}]}, {"label": "Step 03 · 서술형 심화 B", "passage": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganizing cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed occurring mainly during childhood, with adulthood seeing as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing what development continues across the entire lifespan. Despite the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "foot": "", "qs": [{"src": "Step 03 129번", "type": "어법 수정", "kind": "write", "stem": "다음 글에서 어법상 어색한 부분을 모두 골라 바르게 고치시오. (틀린 부분 5개)", "extras": {"bogi": "", "cond": [], "summary": "", "hint": ""}, "answer": "…, and reorganizing → reorganize\n…was believed occurring → to occur\n…with adulthood seeing → seen\n…by emphasizing what → that\n…lifespan. Despite → Although", "exp": "", "id": "v-S3-129"}]}, {"label": "Step 04 · 실전 모의고사 1회", "passage": "Human development is now increasingly understood as an ① [[ongoing]], flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It ② [[highlights]] that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur ③ [[mainly]] during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity ④ [[supports]] this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life ⑤ [[allows]] room for adaptation and transformation.", "foot": "", "qs": [{"src": "Step 04 1회 9번", "type": "어휘", "kind": "inline", "stem": "다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "choices": ["①", "②", "③", "④", "⑤"], "exp": "④ supports (지지하다) → challenges (이의를 제기하다) [해설] 이 글의 내용은 인간 발달이 고정된 단계가 아니라 평생에 걸쳐 지속되는 유연한 과정이며, 이러한 관점의 핵심이 ‘가소성’이라는 개념이라는 것이다. 가소성의 개념은 발달이 아동기에 국한된다는 기존의 경직된 관점과 대립한다. 따라서 ‘지지한다’라는 의미의 ‘supports’는 ‘이의를 제기한다’라는 의미의 ‘challenges’로 바뀌어야 한다.", "ans": [3], "id": "v-S4r1-9"}]}, {"label": "Step 04 · 실전 모의고사 2회", "passage": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. ( ① ) At the core of this perspective lies the concept of plasticity. ( ② ) Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. ( ③ ) It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. ( ④ ) In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. ( ⑤ ) Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "foot": "", "qs": [{"src": "Step 04 2회 12번", "type": "문장 삽입", "kind": "insert", "stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "choices": ["①", "②", "③", "④", "⑤"], "given": "The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan.", "exp": "⑤ [해설] 주어진 문장의 ‘이러한 경직된 관점(this rigid outlook)’은 발달이 주로 유년기에 이루어지고 성인기는 안정기, 노년기는 쇠퇴기라고 보는 기존 발달관을 가리킨다. 이 관점을 가소성으로 반박하며 전 생애의 발달을 강조한 뒤, 변화의 정도는 달라도 모든 시기에 적응과 변화가 가능하다는 마지막 문장으로 이어져야 한다. 따라서 기존 발달관을 설명한 문장 직후인 ⑤번의 위치에 들어가는 것이 가장 적절하다.", "ans": [4], "id": "v-S4r2-12"}, {"src": "Step 04 2회 13번", "type": "주제·요지 영작", "kind": "write", "stem": "[주관식 3] 윗글의 요지를 아래 <보기>의 단어를 활용하여 알맞게 완성하시오.", "extras": {"bogi": "developmental / lifelong / human / plasticity / of / the / implies / and / adaptation / changes / continuation", "cond": [], "summary": "", "hint": ""}, "answer": "Plasticity implies the lifelong continuation of human adaptation and developmental changes.", "exp": "가소성은 인간의 적응과 발달적 변화가 평생 동안 지속됨을 의미한다.", "id": "v-S4r2-13"}]}, {"label": "워크북 · 문단순서배열", "passage": "", "foot": "", "qs": [{"id": "v-W-8", "src": "워크북 순서 8번", "type": "글의 순서", "kind": "order", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?", "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "ans": [1], "exp": "② [해설] (워크북(3) 문단순서배열 문항을 5지선다로 바꿈) 주어진 글은 인간 발달이 계속 변화하는 과정으로 이해되며 그 핵심에 가소성 개념이 있다고 했다. (B)는 가소성의 정의(변하고 적응하는 인간의 능력)와 개인이 평생 성장할 수 있는 능동적 행위자라는 점을 설명한다. (A)는 이와 대비되는 이전의 관점(발달은 주로 어린 시절에 일어나고 성인기는 안정기, 노년기는 쇠퇴기)을 소개한다. (C)의 this rigid outlook(이 경직된 관점)은 (A)의 이전 관점을 가리키며, 가소성이 이에 이의를 제기한다고 마무리한다. 따라서 (B)-(A)-(C)이다.", "given": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity.", "paras": ["(A) In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline.", "(B) Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives.", "(C) The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation."]}]}, {"label": "직전보강 · 시험 유형", "passage": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely active recipients of development but passive agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "foot": "", "qs": [{"id": "v-J-18", "src": "직전보강 18번", "type": "문맥상 낱말 (고쳐 쓰기)", "kind": "write", "stem": "윗글에서 문맥상 쓰임이 어색한 낱말 2개를 찾아 바르게 고쳐 쓰시오.", "exp": "가소성 개념은 개인이 발달을 ‘수동적으로’ 받아들이기만 하는 존재가 아니라 평생 성장할 수 있는 ‘능동적인’ 행위자라는 점을 강조한다. 따라서 active와 passive의 자리가 서로 바뀌어야 한다.", "answer": "active → passive\npassive → active"}]}, {"label": "추가 변형 · 시험 유형 보충", "passage": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "foot": "", "qs": [{"id": "v-X-21", "src": "추가 변형 21번", "type": "함축 의미", "kind": "list", "stem": "다음 글에서 밑줄 친 active agents capable of growth throughout their lives가 의미하는 바로 가장 적절한 것은?", "choices": ["people who can take part in their own development at every stage of life", "people whose development is fully determined in childhood", "people who depend on experts to guide their growth", "people who resist changes in their environment", "people who grow only when they face biological changes"], "ans": [0], "exp": "① 삶의 모든 단계에서 자신의 발달에 참여할 수 있는 사람들 [해설] 가소성 개념은 개인이 발달을 수동적으로 받아들이기만 하는 존재가 아니라, 삶의 경험·환경의 요구·생물학적 변화에 맞춰 스스로 변하고 적응하며 평생 성장할 수 있는 존재라는 점을 강조한다. ②는 글이 비판하는 이전의 관점이고, ⑤는 생물학적 변화만을 조건으로 들어 지나치게 좁다. ① 삶의 모든 단계에서 자신의 발달에 참여할 수 있는 사람들 ② 발달이 어린 시절에 완전히 결정되는 사람들 ③ 성장을 이끌어 줄 전문가에게 의존하는 사람들 ④ 환경의 변화에 저항하는 사람들 ⑤ 생물학적 변화를 겪을 때만 성장하는 사람들", "underline": "active agents capable of growth throughout their lives"}]}, {"label": "추가 변형 · 시험 유형 보충", "passage": "Human development is now increasingly understood as ① [[an ongoing, flexible, and evolving process]] rather than ② [[a fixed sequence of stages]]. At the core of this perspective lies ③ [[the concept of plasticity]]. Plasticity refers to ④ [[the human capacity to change]], adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development continues across the entire lifespan. Although the extent of change may vary at different stages, every phase of life allows ⑤ [[room for adaptation and transformation]].", "foot": "", "qs": [{"id": "v-X-22", "src": "추가 변형 22번", "type": "의미가 다른 하나", "kind": "inline", "stem": "다음 글의 밑줄 친 ①~⑤ 중에서 함축하는 의미가 나머지 넷과 다른 것은?", "choices": ["①", "②", "③", "④", "⑤"], "ans": [1], "exp": "② [해설] ①·③·④·⑤는 인간 발달이 평생 계속되며 변화하고 적응할 수 있다는 가소성의 관점을 나타낸다. ② a fixed sequence of stages(고정된 단계의 연속)는 이 관점이 대체한 이전의 경직된 관점을 나타내므로 나머지와 다르다."}]}, {"label": "추가 변형 · 시험 유형 보충", "passage": "Human development is now increasingly understood as an ongoing, flexible, and evolving process rather than a fixed sequence of stages. At the core of this perspective lies the concept of plasticity. Plasticity refers to the human capacity to change, adapt, and reorganize cognitive, emotional, and behavioural patterns in response to life experiences, environmental demands, and biological changes. It highlights that individuals are not merely passive recipients of development but active agents capable of growth throughout their lives. In earlier views, development was believed to occur mainly during childhood, with adulthood seen as a period of stability and old age as a phase of decline. The concept of plasticity challenges this rigid outlook by emphasizing that development {{BLANK}}. Although the extent of change may vary at different stages, every phase of life allows room for adaptation and transformation.", "foot": "", "qs": [{"id": "v-X-23", "src": "추가 변형 23번", "type": "빈칸", "kind": "blank", "stem": "다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?", "choices": ["ends once childhood is over", "follows the same fixed stages for everyone", "continues across the entire lifespan", "depends mostly on biological changes", "slows down sharply in adulthood"], "ans": [2], "exp": "③ 전 생애에 걸쳐 계속된다 [해설] 이전의 관점은 발달이 주로 어린 시절에 일어나고 성인기는 안정기, 노년기는 쇠퇴기라고 보았다. 가소성 개념은 이 경직된 관점에 이의를 제기하므로, 발달이 전 생애에 걸쳐 계속된다는 내용이 와야 한다. 마지막 문장의 ‘삶의 모든 단계가 적응과 변화의 여지를 허용한다’도 이를 뒷받침한다. ①·②·⑤는 글이 비판하는 이전 관점에 가깝다. ① 어린 시절이 끝나면 끝난다 ② 모든 사람에게 똑같이 고정된 단계를 따른다 ③ 전 생애에 걸쳐 계속된다 ④ 주로 생물학적 변화에 달려 있다 ⑤ 성인기에 급격히 느려진다"}]}], "il": [{"u": [{"w": [["Human", 0], ["development", 1], ["is", 2]], "ko": "인간 발달은"}, {"w": [["now", 3], ["increasingly", 4], ["understood", 5], ["/", -1]], "ko": "오늘날 점점 이해되고 있다."}, {"w": [["as", 6], ["an", 7], ["ongoing", 8], [",", -1], ["flexible", 9], [",", -1], ["and", 10], ["evolving", 11], ["process", 12], ["/", -1]], "ko": "계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로"}, {"w": [["rather", 13], ["than", 14], ["a", 15], ["fixed", 16], ["sequence", 17], ["of", 18], ["stages.", 19]], "ko": "고정된 순서의 단계들이라기보다는"}], "t": [["Human", "인간의", "추가 풀이"], ["development", "발달", "추가 풀이"], ["is", "", ""], ["now", "오늘날, 지금", "추가 풀이"], ["increasingly", "점점 더", "어휘 LIST"], ["understood", "이해되는", "추가 풀이"], ["as", "", ""], ["an", "", ""], ["ongoing", "계속 진행 중인", "어휘 LIST"], ["flexible", "유연한", "어휘 LIST"], ["and", "", ""], ["evolving", "서서히 발전하는", "어휘 LIST"], ["process", "과정", "추가 풀이"], ["rather", "(rather than) ~라기보다는", "추가 풀이"], ["than", "", ""], ["a", "", ""], ["fixed", "고정된", "어휘 LIST"], [
