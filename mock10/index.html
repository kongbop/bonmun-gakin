장 적절한 것을 고르시오.", "given": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "passage": ["(A) This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "(B) An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "(C) We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective?"], "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "ans": 4, "why": "“we are not the user” → (C) 너무 가까워 객관적으로 못 봄 + “So how can designers…?” 질문 → (B) 답: usability testing → (A) This technique = 그 테스트의 효과."}, "sents": [{"m": "❶", "en": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user.", "ko": "디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다."}, {"m": "❷", "en": "We’re much too close to what we build to objectively see it and understand how users will interact with it.", "ko": "우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다."}, {"m": "❸", "en": "The best user interfaces are those that have been shaped by observations of real users and their interactions with them.", "ko": "가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다."}, {"m": "❹", "en": "So how can designers shape their work to be more effective?", "ko": "그러면 디자이너들은 어떻게 자신의 작업이 더 효과적일 수 있도록 만들 수 있을까?"}, {"m": "❺", "en": "An incredibly effective way is with usability testing.", "ko": "한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다."}, {"m": "❻", "en": "The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "ko": "이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 문제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다."}, {"m": "❼", "en": "This technique is effective for understanding how well a design will perform once it is in the hands of real users.", "ko": "이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다."}, {"m": "❽", "en": "Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "ko": "디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다."}], "gram": {"text": "❶ A simple truth that designers must embrace in order to create more effective products and experiences {{0}} the fact {{1}} we are not the user. ❷ We’re much too close to what we build to objectively see it and {{2}} how users will interact with it. ❸ The best user interfaces are those that have {{3}} by observations of real users and their interactions with them. ❹ So how can designers shape their work to be more effective? ❺ An incredibly effective way is with usability testing. ❻ The goal of this method is to uncover problems in a design, discover existing opportunities, and {{4}} more about the behaviors and preferences of users by asking participants to engage in realistic activities. ❼ This technique is effective for understanding how well {{5}} perform once it is in the hands of real users. ❽ Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "items": [{"n": 1, "opts": ["are", "is"], "a": 1}, {"n": 2, "opts": ["that", "what"], "a": 0}, {"n": 3, "opts": ["understand", "understanding"], "a": 0}, {"n": 4, "opts": ["been shaped", "shaped"], "a": 0}, {"n": 5, "opts": ["learn", "learning"], "a": 0}, {"n": 6, "opts": ["a design will", "will a design"], "a": 0}]}, "variants": [{"label": "Step 01 · 복합형", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to (ㄱ) [ subjectively / objectively ] see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to (ㄴ) [ uncover / conceal ] problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to (ㄷ) [ impair / improve ] their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"src": "Step 01 68번", "type": "어휘", "kind": "combo", "stem": "윗글의 괄호 (ㄱ), (ㄴ), (ㄷ) 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "ans": [4], "exp": "⑤ [해설] (ㄱ) 디자이너는 자신이 만든 작업물과 지나치게 가까운 관계에 있어 사용자의 관점에서 편견 없이 평가하기 어렵다는 흐름이므로, ‘객관적으로’라는 의미의 ‘objectively’가 적절하다. ‘subjectively’는 ‘주관적으로’라는 의미이다. (ㄴ) 사용성 테스트는 실제적인 활동을 통해 디자인의 문제점을 찾아내고 개선할 기회를 파악하는 방법임을 보여 주므로, ‘uncover’가 적절하다. ‘conceal’은 ‘감추다’라는 의미이다. (ㄷ) 대표 사용자들에게서 얻은 결과를 바탕으로 디자인을 수정하여 더욱 효과적인 작업물을 만드는 흐름이므로, ‘개선하다’라는 의미의 ‘improve’가 적절하다. ‘impair’는 ‘손상시키다, 저하시키다’ 라는 의미이다.", "choices": ["(ㄱ) objectively  ·  (ㄴ) conceal  ·  (ㄷ) improve", "(ㄱ) subjectively  ·  (ㄴ) uncover  ·  (ㄷ) impair", "(ㄱ) objectively  ·  (ㄴ) uncover  ·  (ㄷ) impair", "(ㄱ) subjectively  ·  (ㄴ) conceal  ·  (ㄷ) improve", "(ㄱ) objectively  ·  (ㄴ) uncover  ·  (ㄷ) improve"]}, {"src": "Step 01 70번", "type": "요약문", "kind": "summary", "stem": "윗글의 내용을 다음과 같이 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "ans": [2], "exp": "③ 프로젝트에 깊이 관여하면서 생기는 (A) 주관성을 줄이기 위해, 디자이너는 사용성 테스트를 통해 얻은 (B) 근거를 바탕으로 제품을 개선해야 한다. [해설] 이 글은 디자이너가 자신의 작업물을 객관적으로 평가하는 데 한계가 있으므로 실제 사용자를 통해 얻은 결과를 활용해야 한다는 내용이다. 따라서 요약문의 빈칸 (A)에는 ‘subjectivity’, (B)에는 ‘evidence’를 바탕으로 제품을 개선해야 한다는 것이 적절하다. ① subjectivity : 주관성 / consensus : 합의 ② expertise : 전문성 / intuition : 직관 ④ expertise : 전문성 / consensus : 합의 ⑤ indifference : 무관심 / evidence : 근거", "choices": ["subjectivity / consensus", "expertise / intuition", "subjectivity / evidence", "expertise / consensus", "indifference / evidence"], "summary": "To counter the (A) arising from their close involvement in a project, designers should base product refinements on (B) obtained through usability testing."}]}, {"label": "Step 02 · 유형별 A", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"src": "Step 02 36번", "type": "제목", "kind": "list", "stem": "다음 글의 제목으로 가장 적절한 것은?", "choices": ["The Designer's Dilemma: Art vs. Commerce", "Usability Testing: A Costly but Necessary Evil?", "The Evolution of User Interface in the Digital Age", "How to Become a More Creative Product Designer", "Through Other Eyes: Refining Products by Watching People in Action"], "ans": [4], "exp": "⑤ 다른 이의 눈으로: 사람들의 실제 행동을 관찰하며 제품 다듬기 [해설] 이 글은 디자이너와 사용자의 관점이 다르므로 실제 사용자의 행동을 관찰하는 사용성 테스트가 디자인 개선에 효과적임을 설명한다. 참여자들이 실제와 유사한 활동을 수행하는 과정을 관찰해 문제점과 개선 기회를 찾고, 그 결과를 바탕으로 제품을 수정할 수 있다는 것이다. 따라서 이 글의 제목으로 가장 적절한 것은 ‘다른 이의 눈으로: 사람들의 실제 행동을 관찰하며 제품 다듬기’ 이다. ① 디자이너의 딜레마: 예술인가 상업인가 ② 사용성 테스트: 비용이 많이 들지만 필요악인가? ③ 디지털 시대의 사용자 인터페이스의 진화 ④ 더 창의적인 제품 디자이너가 되는 방법"}]}, {"label": "Step 02 · 유형별 B", "passage": "", "foot": "", "qs": [{"src": "Step 02 58번", "type": "글의 순서", "kind": "order", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "given": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to objectively see it and understand how users will interact with it.", "paras": ["(A) An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities.", "(B) This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "(C) The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective?"], "ans": [3], "exp": "④ [해설] 주어진 글은 디자이너가 사용자와 다르며 자신의 작업을 객관적으로 바라보기 어렵다는 점을 제시한다. (C)는 실제 사용자 관찰을 반영한 인터페이스의 중요성을 설명한 뒤, 어떻게 더 효과적으로 설계할 수 있는지 질문한다. (A)는 이 질문에 답하며 사용성 테스트를 소개하고 그 목적을 설명한다. (B)의 ‘This technique’은 (A)의 사용성 테스트를 가리키며, 이 방법의 효과와 결과에 따른 디자인 수정 가능성을 설명하며 마무리한다. 따라서 가장 적절한 순서는 (C)-(A)-(B)이다."}]}, {"label": "Step 02 · 유형별 B", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"src": "Step 02 78번", "type": "요약문", "kind": "summary", "stem": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "choices": ["objective finish", "objective refine", "subjective ignore", "subjective refine", "innovative ignore"], "summary": "Since designers tend to have a(n) (A) perspective on their own work, usability testing helps designers (B) products by incorporating feedback from actual users.", "ans": [3], "exp": "④ 디자이너는 자신의 작업에 대해 (A) 주관적인 관점을 갖기 쉬우므로, 사용성 테스트는 실제 사용자의 피드백을 반영하여 제품을 (B) 개선하는 데 도움을 준다. [해설] 이 글은 디자이너가 자신의 작업에 너무 가까워 객관적으로 평가하기 어렵기 때문에 실제 사용자 관찰을 통한 사용성 테스트로 디자인을 개선할 수 있다는 내용이다. 또한, 대표 사용자에게서 얻은 결과를 바탕으로 문제점과 개선 기회를 파악하고 수정하고, 디자이너의 주관성을 보완하여 제품을 개선한다고 설명한다. 따라서 요약문의 빈칸 (A)에는 ‘subjective’가, (B)에는 ‘refine’이 들어가는 것이 적절하다. ① objective : 객관적인 / finish : 완성하다 ② objective : 객관적인 / refine : 개선하다 ③ subjective : 주관적인 / ignore : 무시하다 ⑤ innovative : 혁신적인 / ignore : 무시하다"}]}, {"label": "Step 03 · 서술형 기본", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re (A) 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. (B) 이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"src": "Step 03 67번", "type": "배열 영작", "kind": "write", "stem": "윗글의 밑줄 친 (A)의 우리말과 같도록 아래 <조건>을 참고하여 알맞게 배열하시오.", "extras": {"bogi": "close / understand / it / objectively / we / with / will / users / how / to / what / interact / see / and / build / too / it / to / much", "cond": ["관계대명사 what 및 간접의문문 활용"], "summary": "", "hint": ""}, "answer": "much too close to what we build to objectively see it and understand how users will interact with it", "exp": "", "id": "v-S3-67"}, {"src": "Step 03 68번", "type": "배열 영작", "kind": "write", "stem": "윗글의 밑줄 친 (B)의 우리말과 같도록 아래 <보기>의 단어를 알맞게 배열하시오.", "extras": {"bogi": "understanding / the / a design / is / effective / for / will / it / in / is / how / this / technique / well / hands / once / perform / of / real users", "cond": ["간접의문문 활용"], "summary": "", "hint": ""}, "answer": "This technique nd": "write", "stem": "윗글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 곳을 찾아 바르게 고치시오.", "extras": {"bogi": "", "cond": [], "summary": "", "hint": ""}, "answer": "ⓐ, ⓑ, ⓓ", "exp": "ⓐ A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. - 주어 동사 수일치 : 주어 ‘A simple truth’에 맞춰 단수 동사가 적절하다. A simple truth [that designers ~ experiences] is ⓑ We’re much too close to what we build to objectively see it and understand how users will interact with it. - 간접의문문 (의문부사 + 완전한 문장) : 동사 ‘understand’의 목적어 자리에 명사절로 간접의문문이 필요하며, ‘의문사 + 주어 + 동사’의 어순이 적절하다. 의문부사 ‘how, when, why, where’은 완전한 문장을 수반하고, 의문대명사 ‘what, which, who'는 불완전한 문장을 수반한다. 완전한 문장이므로 ‘how’가 적절하다. ⓓ and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. - 5형식 ask + O + O.C (to V) : 5형식 동사 ‘ask’는 목적어와 목적격 보어의 관계가 능동일 때 to 부정사를 사용한다.", "id": "v-S3-110"}]}, {"label": "Step 03 · 서술형 심화 B", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact which we are not the user. We’re much too close to which we build to objectively see it and understand what users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discovering existing opportunities, and learn more about the behaviors and preferences of users by asking participants engaging in realistic activities. This technique is effective for understanding how good a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"src": "Step 03 132번", "type": "어법 수정", "kind": "write", "stem": "다음 글에서 어법상 어색한 부분을 모두 골라 바르게 고치시오. (틀린 부분 6개)", "extras": {"bogi": "", "cond": [], "summary": "", "hint": ""}, "answer": "…the fact which → that\n…close to which → what\n…and understand what → how\n…design, discovering → discover\n…asking participants engaging → to engage\n…understanding how good → well", "exp": "", "id": "v-S3-132"}]}, {"label": "Step 04 · 실전 모의고사 1회", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"src": "Step 04 1회 13번", "type": "주제·요지 영작", "kind": "write", "stem": "[주관식 3] 윗글의 요지를 아래 <보기>의 단어를 활용하여 알맞게 완성하시오.", "extras": {"bogi": "is / subjectivity / effective / designers / for / method / testing / improve / work / their / and / overcome / an / usability / to", "cond": [], "summary": "", "hint": ""}, "answer": "Usability testing is an effective method for designers to overcome subjectivity and improve their work.", "exp": "사용성 테스트는 디자이너가 주관성을 극복하고 자신의 작업을 개선할 수 있는 효과적인 방법이다.", "id": "v-S4r1-13"}]}, {"label": "Step 04 · 실전 모의고사 2회", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that {{BLANK}}. We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"src": "Step 04 2회 16번", "type": "빈칸", "kind": "blank", "stem": "다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.", "choices": ["market trends should dictate every design choice", "usability testing is the only way to build a product", "they possess an objective viewpoint on their own work", "they cannot serve as a reliable proxy for their target audience", "technical specifications are more important than user experience"], "exp": "④ 그들은 목표 사용자 집단의 입장을 신뢰할 만하게 대변할 수 없다 [해설] 이 글은 디자이너가 자신의 작업을 객관적으로 바라보기 어려우므로 실제 사용자에게서 얻은 자료를 바탕으로 디자인을 개선하는 것이 효과적이라는 내용이다. 사용성 테스트를 통해 사용자의 행동과 선호를 확인하고 그 결과를 반영한다고 설명하므로, 빈칸에는 디자이너가 실제 사용자의 입장을 충분히 대신할 수 없다는 내용이 들어가야 한다. 따라서 ‘그들은 목표 사용자 집단의 입장을 신뢰할 만하게 대변할 수 없다’가 가장 적절하다. ① 시장 동향이 모든 디자인 선택을 좌우해야 한다 ② 사용성 테스트가 제품을 만드는 유일한 방법이다 ③ 그들은 자신의 작업에 대해 객관적인 관점을 지니고 있다 ⑤ 기술적 사양이 사용자 경험보다 더 중요하다 * 원문 변형 ④ we are not the user → they cannot serve as a reliable proxy for their target audience", "ans": [3], "id": "v-S4r2-16"}]}, {"label": "직전보강 · 시험 유형", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. {{BLANK}} how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"id": "v-J-11", "src": "직전보강 11번", "type": "빈칸 (연결어 쓰기)", "kind": "write", "stem": "윗글의 빈칸에 들어갈 연결어를 쓰시오.", "exp": "앞에서 디자이너는 사용자가 아니며, 가장 좋은 인터페이스는 실제 사용자를 관찰해서 만들어진다고 했다. 이를 받아 ‘그렇다면 디자이너는 어떻게 작업을 더 효과적으로 만들 수 있을까?’라고 질문을 이어 가므로 So가 알맞다.", "answer": "So"}]}, {"label": "직전보강 · 시험 유형", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to cover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"id": "v-J-20", "src": "직전보강 20번", "type": "문맥상 낱말 (고쳐 쓰기)", "kind": "write", "stem": "윗글에서 문맥상 쓰임이 어색한 낱말 1개를 찾아 바르게 고쳐 쓰시오.", "exp": "사용성 테스트의 목표는 디자인의 문제를 ‘밝혀내고(uncover)’, 기존의 가능성을 발견하며, 사용자의 행동과 선호를 더 알아 가는 것이다. cover(덮다, 숨기다)는 문제를 찾아 개선한다는 글의 흐름과 반대이다.", "answer": "cover → uncover"}]}, {"label": "추가 변형 · 시험 유형 보충", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. We’re much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of real users and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking participants to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from representative users.", "foot": "", "qs": [{"id": "v-X-27", "src": "추가 변형 27번", "type": "함축 의미", "kind": "list", "stem": "다음 글에서 밑줄 친 we are not the user가 의미하는 바로 가장 적절한 것은?", "choices": ["Designers should rely on their own preferences when creating products.", "Users should be involved in a company’s business decisions.", "Designers cannot see their products the way real users do.", "Designers are not responsible for how users behave.", "Users rarely notice the problems in a product’s design."], "ans": [2], "exp": "③ 디자이너는 자신의 제품을 실제 사용자가 보는 방식으로 볼 수 없다. [해설] 바로 다음 문장에서 디자이너는 자신이 만든 것에 너무 가까워서 그것을 객관적으로 보거나 사용자가 어떻게 상호 작용할지 이해할 수 없다고 했다. 그래서 실제 사용자를 관찰하는 사용성 테스트가 필요하다는 흐름이다. ①은 글의 주장과 반대이다. ① 디자이너는 제품을 만들 때 자신의 선호에 의존해야 한다. ② 사용자는 회사의 사업 결정에 참여해야 한다. ③ 디자이너는 자신의 제품을 실제 사용자가 보는 방식으로 볼 수 없다. ④ 디자이너는 사용자가 어떻게 행동하는지에 대해 책임이 없다. ⑤ 사용자는 제품 디자인의 문제를 거의 알아차리지 못한다.", "underline": "we are not the user"}]}, {"label": "추가 변형 · 시험 유형 보충", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not ① [[the user]]. ② [[We’re]] much too close to what we build to objectively see it and understand how users will interact with it. The best user interfaces are those that have been shaped by observations of ③ [[real users]] and their interactions with them. So how can designers shape their work to be more effective? An incredibly effective way is with usability testing. The goal of this method is to uncover problems in a design, discover existing opportunities, and learn more about the behaviors and preferences of users by asking ④ [[participants]] to engage in realistic activities. This technique is effective for understanding how well a design will perform once it is in the hands of real users. Designers can use this method to improve their work through subsequent revisions based on the findings from ⑤ [[representative users]].", "foot": "", "qs": [{"id": "v-X-28", "src": "추가 변형 28번", "type": "의미가 다른 하나", "kind": "inline", "stem": "다음 글의 밑줄 친 ①~⑤ 중에서 함축하는 의미가 나머지 넷과 다른 것은?", "choices": ["①", "②", "③", "④", "⑤"], "ans": [1], "exp": "② [해설] ①·③·④·⑤는 모두 제품을 실제로 사용하는 사람들, 즉 사용자(사용성 테스트의 참가자)를 가리킨다. ② We’re의 We는 자신이 만든 것에 너무 가까워 그것을 객관적으로 보지 못하는 디자이너들을 가리키므로 나머지와 다르다."}]}, {"label": "추가 변형 · 시험 유형 보충", "passage": "A simple truth that designers must embrace in order to create more effective products and experiences is the fact that we are not the user. ( ① ) We’re much too close to what we build to objectively see it and understand how users will interact with it. ( ② ) The best user interfaces are those that have been shaped by observations of real users a repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health."}], "vocab": [["reappraisal", "재평가"], ["avenue", "방법, 수단"], ["regulate", "조절하다"], ["at one’s root", "본질적으로"], ["adverse", "부정적인, 불리한"], ["construe", "해석하다"], ["construal", "해석"], ["overpowering", "강렬한"], ["in the long run", "장기적으로"], ["gratitude", "감사함"], ["accumulate", "축적되다"], ["resilience", "회복 탄력성"]], "key": "37", "exam": {"stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "given": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "passage": ["(A) This example illustrates how reappraisal might powerfully transform short-term emotional responses. When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health. Thereby, reappraisal might be a key to resilience.", "(B) Take, for example, someone who is going through a divorce. This is often an adverse event, and yet, it can be construed in different ways. One might view it as an overpowering loss that will mark one’s family for life. Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "(C) As a result of these different construals, one might feel different emotions. The first construal may bring intense sadness and anger. The second construal might also bring sadness and anger but perhaps at lower levels. Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude."], "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "ans": 2, "why": "재평가 소개 → (B) Take, for example, 이혼(두 가지 해석) → (C) As a result of these different construals(두 해석이 주는 감정) → (A) This example illustrates…(결론)."}, "sents": [{"m": "❶", "en": "Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to regulating emotions because it transforms emotions at their root.", "ko": "재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다."}, {"m": "❷", "en": "Take, for example, someone who is going through a divorce.", "ko": "예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자."}, {"m": "❸", "en": "This is often an adverse event, and yet, it can be construed in different ways.", "ko": "이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다."}, {"m": "❹", "en": "One might view it as an overpowering loss that will mark one’s family for life.", "ko": "누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다."}, {"m": "❺", "en": "Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships.", "ko": "이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다."}, {"m": "❻", "en": "As a result of these different construals, one might feel different emotions.", "ko": "이러한 다른 해석들의 결과로서 누군가는 다른 감정들을 느낄지도 모른다."}, {"m": "❼", "en": "The first construal may bring intense sadness and anger.", "ko": "첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다."}, {"m": "❽", "en": "The second construal might also bring sadness and anger but perhaps at lower levels.", "ko": "두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로 그러할지도 모른다."}, {"m": "❾", "en": "Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude.", "ko": "결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다."}, {"m": "❿", "en": "This example illustrates how reappraisal might powerfully transform short-term emotional responses.", "ko": "이 예시는 재평가가 어떻게 단기적인 감정적 반응들을 강력하게 변화시킬 수 있을지를 보여 준다."}, {"m": "⓫", "en": "When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health.", "ko": "오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다."}, {"m": "⓬", "en": "Thereby, reappraisal might be a key to resilience.", "ko": "그렇게 함으로써 재평가는 회복 탄력성의 해답이 될지도 모른다."}], "gram": {"text": "❶ Reappraisal ― changing the way one thinks about emotional situations ― might present a particularly effective avenue to {{0}} emotions because it transforms emotions at their root. ❷ Take, for example, someone who is going through a divorce. ❸ This is often an adverse event, and yet, it can {{1}} in different ways. ❹ One might view it as an overpowering loss that will mark one’s family for life. ❺ Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as {{2}} relationships. ❻ As a result of these different construals, one might feel different emotions. ❼ The first construal may bring intense sadness and anger. ❽ The second construal might also {{3}} sadness and anger but perhaps at lower levels. ❾ Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude. ❿ This example illustrates how reappraisal might powerfully transform short-term emotional responses. ⓫ When {{4}} over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health. ⓬ Thereby, reappraisal might be a key to resilience.", "items": [{"n": 1, "opts": ["regulate", "regulating"], "a": 1}, {"n": 2, "opts": ["be construed", "construe"], "a": 0}, {"n": 3, "opts": ["improved", "improving"], "a": 0}, {"n": 4, "opts": ["be brought", "bring"], "a": 1}, {"n": 5, "opts": ["repeated", "repeating"], "a": 0}]}, "variants": [{"label": "Step 01 · 복합형", "passage": "Reappraisal — changing the way one thinks about emotional situations — might present a particularly (ㄱ) [ effective / ineffective ] avenue to regulating emotions because it transforms emotions at their root. Take, for example, someone who is going through a divorce. This is often an adverse event, and yet, it can be construed in different ways. One might view it as an overpowering loss that will mark one’s family for life. Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships. As a result of these different construals, one might feel different emotions. The first construal may bring intense sadness and anger. The second construal might also bring sadness and anger but perhaps at (ㄴ) [ lower / higher ] levels. Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude. This example illustrates how reappraisal might powerfully transform short-term emotional responses. When repeated over time, these short-term emotional consequences of reappraisal might (ㄷ) [ accumulate / disperse ] to shape people’s psychological health. Thereby, reappraisal might be a key to resilience.", "foot": "* resilience: 회복 탄력성 ** construe: 해석하다", "qs": [{"src": "Step 01 72번", "type": "어휘", "kind": "combo", "stem": "윗글의 괄호 (ㄱ), (ㄴ), (ㄷ) 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "ans": [4], "exp": "⑤ [해설] (ㄱ) 재평가는 감정을 본질적으로 변화시켜 감정을 조절하는 방법을 제공한다고 했으므로, ‘효과적인’이라는 의미의 ‘effective’가 적절하다. ‘ineffective’는 ‘비효과적인’이라는 의미이다. (ㄴ) 이혼을 긍정적인 결과로 이어질 수 있는 일로 보는 두 번째 해석은, 첫 번째 해석보다 슬픔과 분노의 강도가 더 낮을 것이라고 추론할 수 있으므로 ‘더 낮은’이라는 의미의 ‘lower’가 적절하다. ‘higher’는 ‘더 높은’이라는 의미이다. (ㄷ) 재평가의 단기적인 감정적 결과들이 시간이 지나면서 사람들의 심리적 건강을 형성한다고 했으므로, 이러한 결과들이 '축적되어’ 영향을 미친다는 의미의 ‘accumulate’가 적절하다. ‘disperse’는 ‘흩어지다’라는 의미이다.", "choices": ["(ㄱ) effective  ·  (ㄴ) higher  ·  (ㄷ) accumulate", "(ㄱ) ineffective  ·  (ㄴ) lower  ·  (ㄷ) disperse", "(ㄱ) effective  ·  (ㄴ) higher  ·  (ㄷ) disperse", "(ㄱ) ineffective  ·  (ㄴ) higher  ·  (ㄷ) accumulate", "(ㄱ) effective  ·  (ㄴ) lower  ·  (ㄷ) accumulate"]}, {"src": "Step 01 74번", "type": "요약문", "kind": "summary", "stem": "윗글의 내용을 다음과 같이 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "ans": [0], "exp": "① 감정적 사건에 대한 이해를 (A) 재구성하는 것을 포함하는 재평가는 더 (B) 건설적인 감정적 반응을 만들어 낼 수 있고, 궁극적으로 심리적 회복 탄력성에 기여할 수 있다. [해설] 이 글은 감정적인 상황에 대해 생각하는 방식을 바꾸는 ‘재평가’ 가 감정을 조절하는 효과적인 방법이라고 설명한다. 부정적인 사건을 다르게 해석함으로써(재구성함으로써) 더 긍정적이고 건설적인 감정적 결과를 이끌어내고, 이것이 반복되면 회복 탄력성으로 이어진다는 내용이다. 따라서 요약문의 빈칸 (A)에는 ‘reframing’, (B)에는 ‘constructive’가 들어가는 것이 가장 적절하다. ② reinforcing : 강화하는 것 / destructive : 파괴적인 ③ reframing : 재구성하는 것 / destructive : 파괴적인 ④ ignoring : 무시하는 것 / constructive : 건설적인 ⑤ reinforcing : 강화하는 것 / unpredictable : 예측 불가능한", "choices": ["reframing / constructive", "reinforcing / destructive", "reframing / destructive", "ignoring / constructive", "reinforcing / unpredictable"], "summary": "Reappraisal, which involves (A) one's understanding of an emotional event, can produce more (B) emotional responses and ultimately contribute to psychological resilience."}]}, {"label": "Step 02 · 유형별 A", "passage": "Reappraisal — changing the way one thinks about emotional situations — might present a particularly effective avenue to regulating emotions because it transforms emotions at their root. Take, for example, someone who is going through a divorce. This is often an adverse event, and yet, it can be construed in different ways. One might view it as an overpowering loss that will mark one’s family for life. Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships. As a result of these different construals, one might feel different emotions. The first construal may bring intense sadness and anger. The second construal might also bring sadness and anger but perhaps at lower levels. Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude. This example illustrates how reappraisal might powerfully transform short-term emotional responses. When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health. Thereby, reappraisal might be a key to resilience.", "foot": "* resilience: 회복 탄력성 ** construe: 해석하다", "qs": [{"src": "Step 02 37번", "type": "제목", "kind": "list", "stem": "다음 글의 제목으로 가장 적절한 것은?", "choices": ["The Dangers of Hiding Your True Emotional State", "Divorce: An Unavoidable Crisis in Modern Families", "Short-Term Relief vs. Long-Term Psychological Health", "Why Positive Thinking Doesn't Always Lead to Success", "Reframe Your Mind: The Path to Emotional Resilience"], "ans": [4], "exp": "⑤ 생각의 틀을 바꾸어라: 정서적 회복탄력성으로 가는 길 [해설] 이 글은 같은 상황도 어떻게 해석하느냐에 따라 감정 반응이 달라지며, 재평가가 부정적 감정의 강도를 낮추고 긍정적 감정을 불러올 수 있음을 설명한다. 이러한 단기적 변화가 반복되어 누적되면 장기적인 심리적 건강과 회복탄력성에 도움이 될 수 있다는 것이다. 따라서 이 글의 제목으로 가장 적절한 것은 ‘생각의 틀을 바꾸어라: 정서적 회복탄력성으로 가는 길’이다. ① 당신의 진정한 감정 상태를 숨기는 것의 위험성 ② 이혼: 현대 가족의 피할 수 없는 위기 ③ 단기적 안도감 대 장기적 심리 건강 ④ 긍정적 사고가 항상 성공으로 이어지지는 않는 이유"}]}, {"label": "Step 02 · 유형별 B", "passage": "Reappraisal — changing the way one thinks about emotional situations — might present a particularly effective avenue to regulating emotions because it transforms emotions at their root. Take, for example, someone who is going through a divorce. This is often an adverse event, and yet, it can be construed in different ways. One might view it as an overpowering loss that will mark one’s family for life. Alternatively, one might see it as something that is painful but that might lead to positive outcomes in the long run, such as improved relationships. As a result of these different construals, one might feel different emotions. The first construal may bring intense sadness and anger. The second construal might also bring sadness and anger but perhaps at lower levels. Crucially, it might also bring some positive emotions, such as hope, strength, or gratitude. This example illustrates how reappraisal might powerfully transform short-term emotional responses. When repeated over time, these short-term emotional consequences of reappraisal might accumulate to shape people’s psychological health. Thereby, reappraisal might be a key to {{BLANK}}.", "foot": "* construe: 해석하다", "qs": [{"src": "Step 02 59번", "type": "빈칸", "kind": "blan n Elite Documents", "title_ko": "사회사학자가 엘리트 문서에서 평범한 사람들 역사의 단서를 찾아내는 연구 방법", "gist": "평범한 사람들의 기록이 부족해 생긴 역사 기록의 편향을 극복하기 위해, 사회사학자들은 엘리트가 만든 문서를 액면 그대로 받아들이지 않고 ‘결을 거슬러’ 창의적·비판적으로 읽는다.", "point": "원 시험 주어진 문장: ❼ “Yet rather than simply take such sources at face value, they read them ‘against the grain’.” → 정답 ⑤ (❻ 엘리트 자료 분석 다음, ❽ So, for example 앞). 함축 예상: read them “against the grain” = 기록 작성자의 관점에 비판적으로 의문을 제기하며 엘리트 중심 서술 너머에서 일반 사람들의 삶의 단서를 찾는다.", "flow": ["❶❷ 사회사학자도 원자료 사용, 평범한 사람들을 강조", "❸❹ Yet 비엘리트는 교육 접근 부족 → 기록 적음, 기록해도 보관소에 남지 않음", "❺❻ 이런 편향 때문에 창의적이어야 함 / 엘리트가 만든 자료를 분석", "❼❽ Yet 액면 그대로가 아니라 ‘결을 거슬러’ 읽음 → 노예 소유주 문서의 공백·단절·소문까지 조사"], "grammar": [["did not produce substantial amounts", "substantial = 상당한, 풍부한"], ["Even when they did produce documentation", "강조 조동사 did + 동사원형"], ["rarely ended up in archives where they could be preserved and made available", "준부정어 rarely / 관계부사 where + 완전한 문장 / be p.p. 2개 병렬"], ["Because of such biases", "because of + 명사(구)"], ["textual sources produced by ~", "과거분사 수식"], ["rather than simply take ~", "rather than + 동사원형(또는 동명사)"], ["not only for the “facts” provided by slaveowners; she will also examine", "not only A, also B (세미콜론) / 과거분사 수식"]], "fixes": [{"s": "______, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.", "n": "연결어", "a": "Yet", "why": "평범한 사람을 강조하지만 ↔ 그들의 기록은 부족 (역접)"}, {"s": "Because such biases in the historical record, social historians have to be very creative in their work.", "n": "어법 1곳", "a": "Because → Because of", "why": "뒤가 명사구"}, {"s": "Like other historians, social historians analyze textual sources producing by government officials, employers, and other elites.", "n": "어법 1곳", "a": "producing → produced", "why": "자료가 ‘생산된’ 수동 (by 행위자)"}, {"s": "So, ______, a social historian will read legal documents not only for the “facts” providing by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "n": "연결어 + 어법 1곳", "a": "연결어: for example / providing → provided", "why": "노예 소유주에 의해 ‘제공된’ 사실"}], "writing": [{"ko": "심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다.", "cond": "필수 어휘: researchers / even when / available / documentation / preserve / materials / archives · 조건: 강조 동사, 준부정어, 관계부사절 · 23단어", "ans": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers."}], "vocab": [["primary source", "원자료"], ["elite", "엘리트"], ["lack access to", "~에 대한 접근이 부족하다"], ["substantial", "풍부한, 상당한"], ["documentation", "문서로 된 기록"], ["end up in", "결국 ~에 이르다"], ["archive", "기록 보관소"], ["preserve", "보존하다"], ["bias", "편향"], ["at face value", "액면 그대로"], ["against the grain", "일반적인 방식과 다르게"], ["enslaved", "노예가 된"]], "key": "39", "exam": {"stem": "글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.", "given": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "passage": ["Like all historians, social historians draw from a variety of primary sources. Social history often emphasizes ordinary people rather than elites. ( ① ) Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation. ( ② ) Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers. ( ③ ) Because of such biases in the historical record, social historians have to be very creative in their work. ( ④ ) Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites. ( ⑤ ) So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions."], "choices": ["①", "②", "③", "④", "⑤"], "ans": 4, "why": "주어진 문장의 such sources = ❻ 엘리트가 만든 텍스트 자료 / Yet = ‘다른 역사학자처럼 분석하지만’과의 대조. 뒤의 ❽ So, for example(법적 문서를 결을 거슬러 읽는 예시)으로 이어지므로 ⑤."}, "sents": [{"m": "❶", "en": "Like all historians, social historians draw from a variety of primary sources.", "ko": "모든 역사학자들과 마찬가지로, 사회사학자들은 다양한 원자료들을 가져와 쓴다."}, {"m": "❷", "en": "Social history often emphasizes ordinary people rather than elites.", "ko": "사회사는 대개 엘리트들보다 평범한 사람들을 강조한다."}, {"m": "❸", "en": "Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation.", "ko": "하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다."}, {"m": "❹", "en": "Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "ko": "심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다."}, {"m": "❺", "en": "Because of such biases in the historical record, social historians have to be very creative in their work.", "ko": "역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다."}, {"m": "❻", "en": "Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites.", "ko": "다른 역사학자들처럼 사회사학자들은 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된 텍스트 자료를 분석한다."}, {"m": "❼", "en": "Yet rather than simply take such sources at face value, they read them “against the grain”.", "ko": "하지만 그러한 자료들을 단순히 액면 그대로 받아들이기보다 그들은 그것들을 ‘일반적인 방식과 다르게’ 해석한다."}, {"m": "❽", "en": "So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "ko": "그래서, 예를 들어, 어떤 사회사학자는 법적 문서들을 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해 읽을 뿐만 아니라, 그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다."}], "gram": {"text": "❶ Like all historians, social historians draw from a variety of primary sources. ❷ Social history often emphasizes ordinary people rather than elites. ❸ Yet, in most places and times, non-elites {{0}} access to education and, thus, did not produce substantial amounts of documentation. ❹ Even when they {{1}} produce documentation, these materials rarely ended up in archives {{2}} they could be preserved and made available to researchers. ❺ Because of such biases in the historical record, social historians have to be very creative in their work. ❻ Like other historians, social historians analyze textual sources {{3}} by government officials, employers, and other elites. ❼ Yet rather than simply take such sources at face value, they read them “against the grain”. ❽ So, for example, a social historian will read legal documents not only for the “facts” {{4}} by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "items": [{"n": 1, "opts": ["lacked", "lacking"], "a": 0}, {"n": 2, "opts": ["did", "do"], "a": 0}, {"n": 3, "opts": ["where", "which"], "a": 0}, {"n": 4, "opts": ["produced", "producing"], "a": 0}, {"n": 5, "opts": ["provided", "providing"], "a": 0}]}, "variants": [{"label": "Step 01 · 복합형", "passage": "Like all historians, social historians draw from a variety of primary sources. Social history often (ㄱ) [ neglects / emphasizes ] ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation. Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made (ㄴ) [ available / inaccessible ] to researchers. Because of such biases in the historical record, social historians have to be very creative in their work. Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites. Yet rather than simply take such sources at face value, they read them “against the grain”. So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also (ㄷ) [ examine / ignore ] the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "foot": "* against the grain: 일반적인 방식과 다르게", "qs": [{"src": "Step 01 80번", "type": "어휘", "kind": "combo", "stem": "윗글의 괄호 (ㄱ), (ㄴ), (ㄷ) 안에서 문맥에 맞는 낱말로 가장 적절한 것은?", "ans": [3], "exp": "④ [해설] (ㄱ) 사회사는 엘리트보다 평범한 사람들을 다루는 것을 중요하게 여긴다는 흐름이므로, ‘강조한다’라는 의미의 ‘emphasizes’가 적절하다. ‘neglects’는 ‘무시한다’라는 의미이다. (ㄴ) 기록 보관소는 자료를 보존하고 연구자들이 이용할 수 있게하는 곳이지만, 비엘리트의 자료는 그러한 곳에 들어가는 일이 드물었다는 흐름이므로, ‘이용할 수 있는’이라는 의미의 ‘available’ 이 적절하다. ‘inaccessible’은 ‘접근할 수 없는’이라는 의미이다. (ㄷ) 엘리트가 남긴 문서를 액면 그대로 받아들이지 않고, 침묵이나 소문 같은 세부 사항에서 노예화된 사람들의 태도와 행동에 관한 단서를 찾는 것이므로, ‘검토하다’라는 의미의 ‘examine’이 적절하다. ‘ignore’는 ‘무시하다’라는 의미이다.", "choices": ["(ㄱ) emphasizes  ·  (ㄴ) available  ·  (ㄷ) ignore", "(ㄱ) neglects  ·  (ㄴ) available  ·  (ㄷ) ignore", "(ㄱ) emphasizes  ·  (ㄴ) inaccessible  ·  (ㄷ) examine", "(ㄱ) emphasizes  ·  (ㄴ) available  ·  (ㄷ) examine", "(ㄱ) neglects  ·  (ㄴ) inaccessible  ·  (ㄷ) ignore"]}, {"src": "Step 01 82번", "type": "요약문", "kind": "summary", "stem": "윗글의 내용을 다음과 같이 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "ans": [2], "exp": "③ 역사적 기록은 주로 엘리트의 삶을 기록하기 때문에 종종 (A) 불균형적이어서, 사회사학자들은 평범한 사람들의 경험을 재구성하기 위해 (B) 창의적인 접근법을 사용해야 한다. [해설] 이 글은 역사적 기록이 엘리트 중심으로 편향되어 있어, 사회사학자들이 평범한 사람들의 역사를 연구하기 위해 창의적이고 새로운 방법을 사용해야 한다는 내용이다. 따라서 요약문의 빈칸 (A)에는 ‘unbalanced’, (B)에는 ‘inventive’가 들어가는 것이 가장 적절하다. ① unbalanced : 불균형적인 / conventional : 전통적인 ② abundant : 풍부한 / inventive : 창의적인 ④ objective : 객관적인 / conventional : 전통적인 ⑤ abundant : 풍부한 / quantitative : 양적인", "choices": ["unbalanced / conventional", "abundant / inventive", "unbalanced / inventive", "objective / conventional", "abundant / quantitative"], "summary": "Because historical records are often (A) , largely reflecting elite perspectives, social historians must use (B) approaches to reconstruct the experiences of common people."}]}, {"label": "Step 02 · 유형별 A", "passage": "Like all historians, social historians draw from a variety of primary sources. Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation. Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers. Because of such biases in the historical record, social historians have to be very creative in their work. Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites. Yet rather than simply take such sources at face value, they read them “against the grain”. So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "foot": "* against the grain: 일반적인 방식과 다르게", "qs": [{"src": "Step 02 39번", "type": "제목", "kind": "list", "stem": "다음 글의 제목으로 가장 적절한 것은?", "choices": ["The Bias Inherent in All Primary Sources", "Why Non-Elites Failed to Record Their History", "Archives: A Rich Source of Knowledge about the Past", "Between the Lines: Recovering the Voices History Left Behind", "The Declining Influence of Elites in Modern Historiography"], "ans": [3], "exp": "④ 행간 읽기: 역사에서 소외된 목소리 되찾기 [해설] 이 글은 평범한 사람들이 직접 남긴 기록이 부족한 상황에서 사회사학자들이 엘리트의 기록을 창의적으로 분석하는 방법을 설명한다. 기록을 액면 그대로 받아들이지 않고, 그 속의 침묵과 소문 등에서 소외된 사람들의 태도와 행동에 관한 단서를 찾는다는 내용이다. 따라서 이 글의 제목으로 가장 적절한 것은 ‘행간 읽기: 역사에서 소외된 목소리 되찾기’이다. ① 모든 원자료에 내재된 편향 ② 왜 비(非)엘리트들은 자신들의 역사를 기록하지 못했는가 ③ 기록 보관소: 과거에 관한 풍부한 지식의 원천 ⑤ 현대 역사 서술에서 엘리트의 영향력 감소"}]}, {"label": "Step 02 · 유형별 B", "passage": "", "foot": "* against the grain: 일반적인 방식과 다르게", "qs": [{"src": "Step 02 61번", "type": "글의 순서", "kind": "order", "stem": "주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.", "choices": ["(A) - (C) - (B)", "(B) - (A) - (C)", "(B) - (C) - (A)", "(C) - (A) - (B)", "(C) - (B) - (A)"], "given": "Like all historians, social historians draw from a variety of primary sources. Social history often emphasizes ordinary people rather than elites.", "paras": ["(A) Yet rather than simply take such sources at face value, they read them “against the grain”. So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "(B) Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation. Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers.", "(C) Because of such biases in the historical record, social historians have to be very creative in their work. Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites."], "ans": [2], "exp": "③ [해설] 주어진 글은 사회사학자들이 다양한 원자료를 활용하며, 엘리트 보다 평범한 사람들을 중심으로 연구한다고 제시한다. (B)는 ‘Yet’ 으로 대조를 이루며, 비(非)엘리트층이 남긴 기록이 적고 그 자료가 기록 보관소에 보존되는 경우도 드물었다는 문제점을 설명한다. (C)는 ‘such biases’로 이러한 기록의 편향성을 받아 창의적인 접근이 필요함을 설명하고, 엘리트가 생산한 자료를 분석한다고 언급한다. (A)의 ‘such sources’가 이 자료들을 가리키며, 이를 액면 그대로 받아들이지 않고 이면의 단서를 찾아 읽는 방법과 구체적인 사례를 제시한다. 따라서 가장 적절한 순서는 (B)-(C)-(A) 이다."}]}, {"label": "Step 02 · 유형별 B", "passage": "Like all historians, social historians draw from a variety of primary sources. Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation. Even when they did produce documentation, these materials rarely ended up in archives where they could be preserved and made available to researchers. Because of such biases in the historical record, social historians have to be very creative in their work. Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites. Yet rather than simply take such sources at face value, they read them “against the grain”. So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "foot": "* against the grain: 일반적인 방식과 다르게", "qs": [{"src": "Step 02 81번", "type": "요약문", "kind": "summary", "stem": "다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?", "choices": ["skewed disregard", "balanced imitate", "balanced scrutinize", "objective disregard", "skewed scrutinize"], "summary": "Due to the (A) nature of historical records, which predominantly feature elite perspectives, social historians must (B) these sources critically to reveal the experiences of ordinary people.", "ans": [4], "exp": "⑤ 역사 기록은 주로 엘리트의 관점을 담아 (A) 편향된 성격을 띠므로, 사회사학자들은 평범한 사람들의 경험을 드러내기 위해 이러한 자료를 비판적으로 (B) 면밀히 조사해야 한다. [해설] 이 글은 기록이 부족한 평범한 사람들의 역사를 연구하기 위해 사회사학자들이 엘리트의 자료를 창의적으로 분석한다는 내용이다. 비엘리트층의 기록이 충분히 생산·보존되지 않아 남아 있는 자료가 엘리트의 관점에 편중되어 있으므로, 사회사학자들은 자료를 액면 그대로 받아들이지 않고 침묵과 소문 등의 단서를 비판적으로 살펴야 한다. 따라서 요약문의 빈칸 (A)에는 ‘skewed’가, (B)에는 ‘scrutinize’가 들어가는 것이 적절하다. ① skewed : 편향된 / disregard : 무시하다 ② balanced : 균형 잡힌 / imitate : 모방하다 ③ balanced : 균형 잡힌 / scrutinize : 면밀히 조사하다 ④ objective : 객관적인 / disregard : 무시하다"}]}, {"label": "Step 03 · 서술형 기본", "passage": "Like all historians, social historians draw from a variety of primary sources. Social history often emphasizes ordinary people rather than elites. Yet, in most places and times, non-elites lacked access to education and, thus, did not produce substantial amounts of documentation. Even when they did produce documentation, (A) 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다. Because of such biases in the historical record, social historians have to be very creative in their work. Like other historians, social historians analyze textual sources produced by government officials, employers, and other elites. Yet rather than (B) simply take such sources at face value, they read them “against the grain”. So, for example, a social historian will read legal documents not only for the “facts” provided by slaveowners; she will also examine the silences, interruptions, rumors, and other details that offer hints about the enslaved peoples’ attitudes and actions.", "foot": "* against the grain: 일반적인 방식과 다르게", "qs": [{"src": "Step 03 79번", "type": "조건 영작", "kind": "write", "stem": "윗글의 밑줄 친 (A)의 우리말과 같도록 아래 <조건>을 참고하여 알맞게 영작하시오.", "extras": {"bogi": "up / these / preserve / in archives / rarely / could / and / researchers / available / make / materials / they / ended / to", "cond": ["관계부사 where 및 병렬구조 활용 - <보기> 단어 어형 변화 주의, <보기> 포함 총 17단어"], "summary": "", "hint": ""}, "answer": "these materials rarely ended up in archives where they could be preserved and made available to researchers", "exp": "", "id": "v-S3-79"}, {"src": "Step 03 80번", "type": "서술형", "kind": "write", "stem": "윗글의 밑줄 친 (B) simply take such sources at face value에 해당하는 것을 바로 뒤 예시 문장에서 찾아 쓰시오.", "extras": {"bogi": "", "cond": [], "summary": "", "hint": ""}, "answer": "read legal documents for the “facts” provided by slaveowners", "exp": "", "id": "v-S3-80"}, {"src": "Step 03 81번", "type": "주제·요지 영작", "kind": "write", "stem": "아래 <보기>의 단어를 알맞게 배열하여 윗글의 주제 ": "목적어가 없는 자동사 자리 (생기다)"}, {"s": "It suggests that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "n": "어법 1곳", "a": "suggests → is suggested", "why": "It is suggested that ~ (~라고 일컬어진다)"}, {"s": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and negative reflection time.", "n": "어휘 1곳", "a": "negative → positive", "why": "‘긍정적인’ 성찰 시간"}, {"s": "Reflect, just how lucky are we to be bored?", "n": "어법 1곳", "a": "Reflect → Reflecting", "why": "분사구문 (곰곰이 생각해 보면)"}, {"s": "In hazardous circumstances, the luxury of boredom is available.", "n": "어휘 1곳", "a": "available → unavailable", "why": "무료함은 안전지대에서만 존재 → 위험 속에선 누릴 수 ‘없음’"}, {"s": "Rather than viewing boredom as productive, it should regard as an opportunity for personal development and destructive contemplation.", "n": "어법 1곳 · 어휘 2곳", "a": "① productive → unproductive  ② should regard → should be regarded  ③ destructive → constructive", "why": "무료함을 ‘비생산적’으로 보기보다 / 무료함이 ‘여겨지는’ 수동 / ‘건설적인’ 사유"}], "writing": [{"ko": "무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다.", "cond": "필수 어휘: address / crucial / adequately / recognize / irritation / boredom / harmful · 조건: 가주어·진주어 구문, 명사절(목적어절), 접속사+(Being)+not+과거분사 · 23단어", "ans": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed."}, {"ko": "무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다.", "cond": "필수 어휘: environment / luxury / comprehend / manifest / occasion / inactive · 조건: 관계대명사(주격), 병렬구조 · 19단어(밑줄 부분)", "ans": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, presenting an occasion to appreciate and comprehend the environment."}], "vocab": [["give rise to", "발생시키다"], ["irritation", "짜증"], ["adequately", "적절하게"], ["address", "다루다"], ["idle", "아무것도 안 하는, 한가한"], ["indulgence", "탐닉"], ["pastime", "(여가) 활동, 소일거리"], ["manifest", "나타나다"], ["inactive", "할 일이 없는"], ["hazardous", "위험한"], ["paramount", "가장 중요한"], ["profound", "심오한"], ["contemplation", "사유"], ["constructive", "건설적인"]], "key": "41-42", "exam": {"stem": "41. 윗글의 제목으로 가장 적절한 것은?", "passage": ["It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed. When we believe that the only way to be happy is by searching for fun activities, then we become <u>(a) dependent</u> on those activities, and negative thoughts and emotions arise. It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with <u>(b) troubling</u> thoughts and behavior. The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time. Reflecting, just how lucky are we to be bored? Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone. Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, <u>(c) removing</u> an occasion to appreciate and comprehend the environment. In hazardous circumstances, the luxury of boredom is <u>(d) unavailable</u>. Thus, it is paramount to utilize idle moments for profound self-reflection. It represents an occasion to listen, observe, and appreciate before expressing. Rather than viewing boredom as unproductive, it should be regarded as an opportunity for personal development and <u>(e) constructive</u> contemplation."], "choices": ["Boredom: An Opportunity in Disguise", "The Irony of Choosing Danger Over Safety", "Why Do We Pursue Safety and Comfort in Life?", "What Harmful Effects Boredom Has on Our Minds", "The Harder Our Life Is, the More Meaningful It Becomes"], "ans": 0, "why": "무료함을 낭비가 아니라 자기 개선·성찰·개인적 발달의 기회로 보라 → ① ‘변장한 기회’. ④는 앞부분(해로운 감정)만 다룬 함정.", "q2": {"stem": "42. 밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?", "choices": ["(a)", "(b)", "(c)", "(d)", "(e)"], "ans": 2, "why": "(c) removing → presenting. 무료함은 안전한 상황의 사치로서 환경을 인식·이해할 기회를 ‘제공한다’. 제거한다는 뜻은 문맥과 반대."}}, "sents": [{"m": "❶", "en": "It is crucial to recognize that boredom can give rise to harmful emotions such as depression, despair, and irritation if not adequately addressed.", "ko": "무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다."}, {"m": "❷", "en": "When we believe that the only way to be happy is by searching for fun activities, then we become dependent on those activities, and negative thoughts and emotions arise.", "ko": "우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다."}, {"m": "❸", "en": "It is suggested that ‘Idle time is the devil’s workshop’ implies that those with too much time on their hands may fill that time with troubling thoughts and behavior.", "ko": "‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다."}, {"m": "❹", "en": "The balance is to not see it as idle time, wasted time, or boredom but rather as a perfect time for self-improvement, self-identification, and positive reflection time.", "ko": "균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다."}, {"m": "❺", "en": "Reflecting, just how lucky are we to be bored?", "ko": "곰곰이 생각해 보면 우리가 무료할 수 있어서 정말 얼마나 행운인가?"}, {"m": "❻", "en": "Boredom doesn’t exist in the presence of danger, as it is only an indulgence pastime in a safe zone.", "ko": "무료함은 위험이 존재하는 곳에서는 존재하지 않는데, 왜냐하면 그것이 단지 안전지대 안에서의 탐닉 활동이기 때문이다."}, {"m": "❼", "en": "Boredom can be perceived as a luxury that typically manifests in safe and inactive situations, presenting an occasion to appreciate and comprehend the environment.", "ko": "무료함은 안전하고 할 일이 없는 상황들에서 const TABS = [['core','핵심 정리'],['exam','실전 문제'],['text','본문 암기'],['gram','어법 선택'],['fix','틀린 곳'],['write','서술형'],['vocab','어휘'],['var','변형 문제']];
const st = {p:0, tab:'core', mode:'study', koFirst:false, showAll:false, vocabKo:false, textMode:'il', hideIl:false, hideFull:false, vocHide:false};
try{ const s = JSON.parse(localStorage.getItem('mock10-state')||'{}'); if(typeof s.p==='number' && DATA[s.p]) st.p=s.p; if(s.tab) st.tab=s.tab; if(s.mode==='wrong'||s.mode==='voc') st.mode=s.mode; }catch(e){}
function save(){ try{ localStorage.setItem('mock10-state', JSON.stringify({p:st.p, tab:st.tab, mode:st.mode})); }catch(e){} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (tag, attrs={}, html='') => { const e=document.createElement(tag); for(const k in attrs){ if(k==='class') e.className=attrs[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); } if(html) e.innerHTML=html; return e; };

function renderChips(){
  const c = document.getElementById('chips'); c.innerHTML='';
  DATA.forEach((p,i)=>{
    const b = el('button',{class:'chip',role:'tab','aria-selected':String(i===st.p),onclick:()=>{st.p=i; st.showAll=false; save(); render(); b.scrollIntoView({inline:'center',block:'nearest'});}}, esc(p.key.replace('-','~'))+'<small>번</small>');
    c.appendChild(b);
  });
}

function renderModes(){
  const mb = document.getElementById('modes'); mb.innerHTML='';
  [['study','지문별 학습'],['mixed','섞어 풀기'],['wrong','오답 노트'],['voc','내 단어장']].forEach(([id,label])=>{
    const b = el('button',{class:'mode'+(st.mode===id?' on':''),type:'button','aria-pressed':String(st.mode===id),onclick:()=>{ st.mode=id; if(id==='mixed' && mx.queue && mx.idx>=mx.queue.length) mx.queue=null; save(); render(); }}, label + (id==='wrong' ? ` <span class="badge" id="wrong-badge">${noteCount()}</span>` : '') + (id==='voc' ? ` <span class="badge blue" id="voc-badge">${vocCount()}</span>` : ''));
    mb.appendChild(b);
  });
}
function render(){
  renderModes();
  const chips = document.getElementById('chips');
  const m = document.getElementById('main'); m.innerHTML='';
  if(st.mode === 'mixed'){ chips.hidden = true; renderMixed(m); return; }
  if(st.mode === 'wrong'){ chips.hidden = true; renderWrong(m); return; }
  if(st.mode === 'voc'){ chips.hidden = true; renderMyVocab(m); return; }
  chips.hidden = false;
  renderChips();
  const p = DATA[st.p];
  const head = el('div',{class:'phead'});
  head.appendChild(el('div',{class:'row'}, `<span class="num">${esc(p.key.replace('-','~'))}번</span><span class="qtype">${esc(p.qtype)}</span>`));
  head.appendChild(el('p',{class:'ten'}, esc(p.title_en)));
  head.appendChild(el('p',{class:'tko'}, esc(p.title_ko)));
  m.appendChild(head);
  const tabs = el('div',{class:'tabs',role:'tablist'});
  TABS.forEach(([id,label])=> tabs.appendChild(el('button',{class:'tab',role:'tab','aria-selected':String(st.tab===id),onclick:()=>{st.tab=id; save(); render();}}, label)));
  m.appendChild(tabs);
  const body = el('div'); m.appendChild(body);
  ({core:renderCore,var:renderVar,exam:renderExam,text:renderText,gram:renderGram,fix:renderFix,write:renderWrite,vocab:renderVocab})[st.tab](p, body);
  const nav = el('div',{class:'navrow'});
  nav.appendChild(el('button',{class:'btn',onclick:()=>{ if(st.p>0){st.p--; save(); render(); window.scrollTo(0,0);} }}, '← 이전 지문'));
  // 변형 문제 탭: 다음 유형(제목 → 문맥상 낱말 → …). 마지막 유형이면 다음 지문의 첫 유형으로
  if(st.tab === 'var'){
    const types = typeList(BANK.filter(q => !q.exam && q.pi === st.p)).filter(x => x !== '전체');
    const i = types.indexOf(vst.filter);
    if(i < types.length - 1){
      const nt = types[i + 1];
      nav.appendChild(el('button',{class:'btn primary',onclick:()=>{ vst.filter = nt; render(); window.scrollTo(0,0); }}, `다음 유형 →<span class="nsub">${esc(nt)}</span>`));
    } else if(st.p < DATA.length - 1){
      const np = st.p + 1;
      const nt = typeList(BANK.filter(q => !q.exam && q.pi === np)).filter(x => x !== '전체')[0];
      nav.appendChild(el('button',{class:'btn primary',onclick:()=>{ st.p = np; vst.filter = nt; save(); render(); window.scrollTo(0,0); }}, `다음 유형 →<span class="nsub">${esc(DATA[np].key.replace('-','~'))}번 ${esc(nt)}</span>`));
    }
  }
  nav.appendChild(el('button',{class:'btn',onclick:()=>{ if(st.p<DATA.length-1){st.p++; save(); render(); window.scrollTo(0,0);} }}, '다음 지문 →'));
  m.appendChild(nav);
}

function renderCore(p, b){
  b.appendChild(el('h3',{},'요지'));
  b.appendChild(el('div',{class:'gist'}, esc(p.gist)));
  b.appendChild(el('h3',{},'출제 포인트'));
  b.appendChild(el('div',{class:'point'}, esc(p.point)));
  b.appendChild(el('h3',{},'글의 흐름'));
  const ol = el('ul',{class:'flow'}); p.flow.forEach(f=> ol.appendChild(el('li',{},esc(f)))); b.appendChild(ol);
  b.appendChild(el('h3',{},'핵심 문법'));
  const w = el('div',{class:'tblwrap'}); const t = el('table',{class:'gr'});
  p.grammar.forEach(([a,c])=> t.appendChild(el('tr',{}, `<td>${esc(a)}</td><td>${esc(c)}</td>`)));
  w.appendChild(t); b.appendChild(w);
}

const TYPE_ORDER = ['제목','문맥상 낱말','밑줄 의미','의미가 다른 하나','빈칸','순서','삽입','요약','서술형','주제·요지 (원 시험)'];
const typeList = qs => { const have = new Set(qs.map(q => TYPE_GROUP(q.type))); return ['전체', ...TYPE_ORDER.filter(t => have.has(t)), ...[...have].filter(t => !TYPE_ORDER.includes(t))]; };
const EXAM_TYPE = {'21':'함축 의미','22':'요지','23':'주제','24':'제목','30':'어휘','31':'빈칸','32':'빈칸','33':'빈칸','34':'빈칸','36':'글의 순서','37':'글의 순서','39':'문장 삽입','41-42':'제목'};
function fmtPassage(t, underline){
  let h = esc(t);
  if(underline){ const u = esc(underline); h = h.replace(u, `<u>${u}</u>`); }
  h = h.replace(/\[\[(.+?)\]\]/g, '<u>$1</u>');
  h = h.replace(/\{\{BLANK\}\}/g, '<span class="blank"></span>');
  h = h.replace(/\((A|B|C|ㄱ|ㄴ|ㄷ)\) \[ ?(.+?) \/ (.+?) ?\]/g, (m,a,x,y)=>`<span class="mk">(${a})</span> <span class="brk">[ ${x} / ${y} ]</span>`);
  h = h.replace(/\( ?([①②③④⑤]) ?\)/g, '<span class="mk">( $1 )</span>');
  h = h.replace(/(^|[^>( ])\s?([①②③④⑤])(?!\s?\))/g, '$1 <span class="mk">$2</span>');
  h = h.replace(/([ⓐⓑⓒⓓⓔ])/g, '<span class="mk">$1</span>');
  h = h.replace(/\((A|B|C)\)(?= )/g, '<span class="mk">($1)</span>');
  h = h.replace(/([가-힣][가-힣0-9 ,.‘’'·~]*[가-힣.])/g, '<span class="kop">$1</span>');
  return h;
}
function fmtExp(e, ok){
  let h = esc(e);
  const i = h.indexOf('[해설]');
  let head = i>=0 ? h.slice(0,i).trim() : h, body = i>=0 ? h.slice(i+4).trim() : '';
  // 원문 변형 메모는 따로 떼고, 끝에 ①~⑤ 순서로 붙은 선택지 해석만 줄을 나눠 보여 준다
  let note = '';
  const ni = body.search(/\*\s?원문 변형/);
  if(ni >= 0){ note = body.slice(ni).replace(/^\*\s?원문 변형/, '').trim(); body = body.slice(0, ni).trim(); }
  const re = /[.다)]\s+(?=[①②③④⑤] )/g; let mm, cut = -1;
  while((mm = re.exec(body))){
    const items = body.slice(re.lastIndex).split(/\s(?=[①②③④⑤] )/).map(x => CIRC.indexOf(x[0]));
    if(items.length >= 3 && items.every((v,i) => v >= 0 && (i === 0 || v > items[i-1]))){ cut = re.lastIndex; break; }
  }
  if(cut >= 0) body = body.slice(0, cut).trim() + '<br><span class="foot">선택지 해석</span><br>' + body.slice(cut).replace(/\s(②|③|④|⑤)\s/g, '<br>$1 ');
  if(note) body += '<br><b>원문 변형</b> ' + note;
  return `<div class="hd ${ok?'':'no'}">${ok?'정답!':'오답'} · 정답 ${head}</div>${body?'<div>'+body+'</div>':''}`;
}

}
function persistVoc(){ try{ localStorage.setItem('mock10-vocab', JSON.stringify(VOC.items)); }catch(e){} writeVoc(); updateVocBadge(); }
const vocId = (key, head) => key + '|' + head.toLowerCase().replace(/[’]/g, "'");
function vocCount(){ return Object.keys(VOC.items).length; }
function updateVocBadge(){ const b = document.getElementById('voc-badge'); if(b) b.textContent = vocCount(); }
function addVoc(key, head, mean, src, ex, exk, surface){
  const id = vocId(key, head);
  if(VOC.items[id]) return id;
  VOC.items[id] = {k:key, w:head, m:mean || '', s:src || '', ex:ex || '', exk:exk || '', f:surface || '', t:Date.now()};
  persistVoc(); return id;
}
function removeVoc(id){ delete VOC.items[id]; persistVoc(); }
// 예전에 복수형·과거형(예: users, enjoyed)으로 저장된 단어를 원형(user, enjoy)으로 옮긴다
function migrateVoc(){
  let changed = false;
  Object.entries(VOC.items).forEach(([id, it]) => {
    const p = DATA.find(x => x.key === it.k); if(!p || !p.vmig) return;
    const mg = p.vmig[(it.w || '').toLowerCase()]; if(!mg) return;
    const [nh, nm, oldMean] = mg; const nid = vocId(it.k, nh);
    if(nid === id) return;
    if(!VOC.items[nid]) VOC.items[nid] = Object.assign({}, it, {w: nh, m: (it.m === oldMean && nm) ? nm : it.m});
    delete VOC.items[id]; changed = true;
  });
  return changed;
}
try{ if(migrateVoc()) localStorage.setItem('mock10-vocab', JSON.stringify(VOC.items)); }catch(e){}

// ── 기록 옮기기: 내 단어장 + 오답 노트를 코드(또는 파일)로 내보내고, 다른 곳에서 가져와 합친다 ──
const b64e = bytes => { let s = ''; for(let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function packRecords(){
  const data = JSON.stringify({app:'mock10', v:1, at:Date.now(), vocab:VOC.items, wrong:NOTE.items});
  const raw = new TextEncoder().encode(data);
  if(typeof CompressionStream === 'function'){
    try{
      const gz = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
      return 'M10Z:' + b64e(gz);
    }catch(e){}
  }
  return 'M10J:' + b64e(raw);
}
async function unpackRecords(code){
  code = (code || '').replace(/\s+/g, '');
  let text;
  if(code.startsWith('M10Z:')){
    if(typeof DecompressionStream !== 'function') throw new Error('이 브라우저는 압축된 코드를 풀 수 없어요. 다른 브라우저(크롬 등)로 열어 주세요.');
    text = await new Response(new Blob([b64d(code.slice(5))]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  } else if(code.startsWith('M10J:')) text = new TextDecoder().decode(b64d(code.slice(5)));
  else if(code.startsWith('{')) text = code;
  else throw new Error('기록 코드가 아니에요. ‘M10’으로 시작하는 코드 전체를 붙여 넣어 주세요.');
  const d = JSON.parse(text);
  if(!d || d.app !== 'mock10' || typeof d.vocab !== 'object' || typeof d.wrong !== 'object') throw new Error('이 학습 페이지의 기록 코드가 아니에요.');
  return d;
}
// 합치기: 이미 있는 단어·오답은 남기고, 없는 것만 더한다(같은 오답이면 틀린 횟수가 많은 쪽을 남김)
function mergeRecords(d){
  let va = 0, vs = 0, wa = 0, ws = 0;
  Object.entries(d.vocab || {}).forEach(([id, it]) => {
    if(!it || !it.k || !it.w) return;
    if(VOC.items[id]) { vs++; return; }
    VOC.items[id] = it; va++;
  });
  Object.entries(d.wrong || {}).forEach(([id, it]) => {
    if(!it || !BYID[id]) return;
    const cur = NOTE.items[id];
    if(cur){ ws++; if((it.n || 0) > (cur.n || 0)) NOTE.items[id] = it; return; }
    NOTE.items[id] = it; wa++;
  });
  migrateVoc();
  persistVoc(); persistNote();
  return {va, vs, wa, ws};
}
const packPlain = () => 'M10J:' + b64e(new TextEncoder().encode(JSON.stringify({app:'mock10', v:1, at:Date.now(), vocab:VOC.items, wrong:NOTE.items})));
const recSig = () => vocCount() + ':' + noteCount() + ':' + JSON.stringify([VOC.items, NOTE.items]).length;

function renderCtx(card, g, shown){
  if(g.label) card.appendChild(el('div',{class:'vlabel'}, esc(g.label)));
  if(g.html){
    if(g.given) card.appendChild(el('div',{class:'given'}, esc(g.given)));

    return;
  }
  const q0 = g.qs[0];
  if(q0.given) card.appendChild(el('div',{class:'given'}, esc(q0.given)));
  if(q0.paras) q0.paras.forEach(pp => card.appendChild(el('div',{class:'para'}, fmtPassage(pp))));

function renderQ(container, q, onDone, showKey){
  if(q.kind === 'write') return renderW(container, q, onDone, showKey);
  const qd = el('div',{class:'vq'});
  qd.appendChild(el('div',{class:'meta'}, (showKey?`<span class="tag src">${esc(q.key.replace('-','~'))}번 지문</span>`:'') + `<span class="tag">${esc(TYPE_GROUP(q.type))}</span><span class="tag src">${esc(q.src)}</span>` + (NOTE.items[q.id] ? '<span class="tag no">오답 노트</span>' : '')));
  qd.appendChild(el('div',{class:'stem'}, esc(q.stem)));
  if(q.summary){
    const sh = esc(q.summary).replace(/\((A|B)\)/g, '<span class="ab">($1)</span><span class="blank" style="min-width:5em"></span>');
    qd.appendChild(el('div',{class:'summ'}, sh));
  }
  const numsOnly = q.choices.every((c,i) => c.trim() === CIRC[i]);
  const box = el('div',{class:'opts'+(numsOnly?' nums':'')}); const exp = el('div',{class:'exp'}); exp.hidden = true;
  const multi = q.ans.length > 1; let fin = false, chk = null; const picked = new Set();
  const finish = ()=>{
    fin = true;
    const ok = picked.size === q.ans.length && q.ans.every(a => picked.has(a));
    [...box.children].forEach((c,i)=>{ if(q.ans.includes(i)) c.classList.add('right'); else if(picked.has(i)) c.classList.add('wrong'); c.classList.remove('sel'); });
    exp.innerHTML = fmtExp(q.exp, ok); exp.hidden = false;
    if(chk) chk.hidden = true;
    recordResult(q.id, ok);
    if(onDone) onDone(ok);
  };
  q.choices.forEach((c,i)=>{
    const ko = /[가-힣]/.test(c) && !/[A-Za-z]{3}/.test(c);
    const bt = el('button',Object.assign({class:'opt'+(ko?' ko':''),type:'button'}, numsOnly?{'aria-label':`${i+1}번`}:{}), numsOnly ? `<span>${CIRC[i]}</span>` : `<span>${CIRC[i]}</span><span>${esc(c)}</span>`);
    bt.addEventListener('click',()=>{
      if(fin) return;
      if(!multi){ picked.add(i); finish(); return; }
      if(picked.has(i)){ picked.delete(i); bt.classList.remove('sel'); } else if(picked.size < 2){ picked.add(i); bt.classList.add('sel'); }
      chk.disabled = picked.size !== 2;
    });
    box.appendChild(bt);
  });
  qd.appendChild(box);
  if(multi){ chk = el('button',{class:'btn primary',type:'button',onclick:()=>{ if(!fin && picked.size === 2) finish(); }}, '2개 골랐으면 채점'); chk.disabled = true; qd.appendChild(chk); }
  qd.appendChild(exp);
  container.appendChild(qd);
  return qd;
}

function renderW(container, q, onDone, showKey){
  const qd = el('div',{class:'vq'});
  qd.appendChild(el('div',{class:'meta'}, (showKey?`<span class="tag src">${esc(q.key.replace('-','~'))}번 지문</span>`:'') + `<span class="tag wr">서술형 · ${esc(q.type)}</span><span class="tag src">${esc(q.src)}</span>` + (NOTE.items[q.id] ? '<span class="tag no">오답 노트</span>' : '')));
  qd.appendChild(el('div',{class:'stem'}, esc(q.stem)));
  const ex = q.extras || {};
  if(ex.summary) qd.appendChild(el('div',{class:'summ'}, esc(ex.summary).replace(/([ⓐⓑⓒⓓⓔ])/g, '<span class="ab">$1</span><span class="blank" style="min-width:4em"></span>')));
  if(ex.bogi) qd.appendChild(el('div',{class:'bogi'}, `<span class="bl">보기</span> ${esc(ex.bogi)}`));
  if(ex.cond && ex.cond.length) qd.appendChild(el('ul',{class:'cond'}, ex.cond.map(c => `<li>${esc(c)}</li>`).join('')));
  if(ex.hint) qd.appendChild(el('div',{class:'hint'}, '힌트 ' + esc(ex.hint)));
  const id = 'w-' + q.id;
  qd.appendChild(el('label',{for:id,class:'hint'}, '내 답'));
  const ta = el('textarea',{id, spellcheck:'false', autocapitalize:'off'}); qd.appendChild(ta);
  const res = el('div'); res.hidden = true;
  let fin = false;
  const record = ok => { if(fin) return; fin = true; recordResult(q.id, ok); if(onDone) onDone(ok); };
  const bar = el('div',{class:'toolbar'});
  const chk = el('button',{class:'btn primary',type:'button'}, '답 확인');
  chk.addEventListener('click', ()=>{
    const model = q.answer || '';
    const user = ta.value.trim();
    const modelHtml = esc(model).replace(/\n/g,'<br>');
    let html = '', exact = false;
    if(q.type === '어법 수정' && /^[ⓐⓑⓒⓓⓔ,\s]+$/.test(model.trim())){
      const set = t => [...new Set(t.match(/[ⓐⓑⓒⓓⓔ]/g) || [])].sort().join(', ');
      exact = !!user && set(user) === set(model);
      html = `<div class="verdict ${exact?'ok':'no'}">${user ? (exact ? '틀린 곳 위치를 정확히 찾았어요. 고친 내용은 해설과 비교해 보세요.' : `내 답: ${esc(set(user)) || '(번호 없음)'} — 정답 위치와 달라요.`) : '답을 쓰지 않았어요.'}</div>`;
    } else if(user){
      // 연결어 쓰기·낱말 고쳐 쓰기는 (A)(B) 표시와 화살표(→, ->)를 빼고 단어만 비교
      const prep = s => /^(빈칸 \(연결어|문맥상 낱말 \(고쳐)/.test(q.type) ? s.replace(/\(([A-E])\)/g, ' ').replace(/->|=>|→|>/g, ' ').replace(/\s-\s/g, ' ').replace(/[\/,]/g, ' ') : s;
      const df = lcsDiff(norm(prep(model)).split(' ').filter(Boolean), norm(prep(user)).split(' ').filter(Boolean));
      exact = df.every(x => x[0] === 'ok');
      html = `<div class="verdict ${exact?'ok':'no'}">${exact ? '모범 답안과 똑같아요!' : '모범 답안과 다른 곳이 있어요 (노란색 = 빠진 말, 빨간 줄 = 다르게 쓴 말)'}</div>` + (exact ? '' : `<div class="diff model">${df.map(([t,wd]) => t==='ok' ? esc(wd) : `<span class="${t}">${esc(wd)}</span>`).join(' ')}</div>`);
    } else {
      html = '<div class="verdict no">답을 쓰지 않았어요. 머릿속으로 떠올린 뒤 정답과 비교해 보세요.</div>';
    }
    html += `<div class="ans" style="margin-top:8px"><b>모범 답안</b><div class="model">${modelHtml}</div>${q.exp ? `<div class="why">${esc(q.exp)}</div>` : ''}</div>`;
    res.innerHTML = html; res.hidden = false;
    if(exact){ record(true); mark.hidden = true; }
    else { mark.hidden = fin; }
    chk.textContent = '다시 비교';
  });
  bar.appendChild(chk); qd.appendChild(bar); qd.appendChild(res);
  const mark = el('div',{class:'toolbar'}); mark.hidden = true;
  mark.appendChild(el('span',{class:'hint'}, '표현이 조금 달라도 뜻과 조건이 맞으면 맞힌 것으로 하세요.'));
  mark.appendChild(el('button',{class:'btn ok',type:'button',onclick:()=>{ record(true); mark.hidden = true; }}, '맞았어요'));
  mark.appendChild(el('button',{class:'btn ng',type:'button',onclick:()=>{ record(false); mark.hidden = true; }}, '틀렸어요'));
  qd.appendChild(mark);
  container.appendChild(qd);
  return qd;
}

  const list = el('div',{class:'vlist'});
  varBlocks(groups, items).forEach(({type, g, qs}, i, arr)=>{
    // '전체'에서는 유형 순서(제목 → 문맥상 낱말 → … → 서술형)대로, 유형이 바뀌는 곳에 제목을 단다
    if(vst.filter === '전체' && (i === 0 || arr[i-1].type !== type)) list.appendChild(el('h3',{class:'vtype'}, esc(type)));
    const card = el('div',{class:'vgroup'});
    renderCtx(card, g, qs);
